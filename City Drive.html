<!DOCTYPE html> testssssss
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>City Drive</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #bcd5e8;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Bahnschrift", "DIN Alternate", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  }
  canvas { position: fixed; inset: 0; display: block; z-index: 0; touch-action: none; }
  button { font-family: inherit; }

  #hud {
    position: fixed; z-index: 2;
    left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top));
    display: flex; align-items: baseline; gap: 6px;
    padding: 8px 16px 9px; border-radius: 14px;
    background: rgba(14, 26, 40, .62); color: #fff;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #spd { font-size: 34px; line-height: 1; font-weight: 700; color: #ffb000; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
  #hud .u { font-size: 14px; opacity: .8; letter-spacing: .04em; }

  #hint {
    position: fixed; z-index: 2; left: 50%; top: max(18px, env(safe-area-inset-top));
    transform: translateX(-50%); padding: 8px 14px; border-radius: 12px;
    background: rgba(14, 26, 40, .62); color: #fff; font-size: 15px; white-space: nowrap;
    pointer-events: none; transition: opacity .8s ease;
  }
  #hint.gone { opacity: 0; }
  @media (max-width: 560px) { #hint { top: auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 190px); } }

  .tgl.on { background: #ffb000; color: #14202c; border-color: #ffd36b; }
  body.is-paused .pad { opacity: 0; pointer-events: none; }
  .pad { transition: opacity .2s ease; }

  /* ---------- pause overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 6; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    padding: 72px 14px 14px;
    background: rgba(10, 20, 32, .5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    visibility: hidden; opacity: 0; transition: opacity .2s ease, visibility .2s;
  }
  .overlay.open { visibility: visible; opacity: 1; }
  .panel {
    width: min(100%, 420px); max-height: 100%; overflow-y: auto; box-sizing: border-box;
    border-radius: 26px; padding: 18px; color: #fff;
    background: rgba(14, 26, 40, .84); border: 1.5px solid rgba(255, 255, 255, .16);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    transform: translateY(10px) scale(.98); transition: transform .22s ease;
    touch-action: pan-y; overscroll-behavior: contain;
  }
  .overlay.open .panel { transform: none; }
  .view { display: none; }
  .view.show { display: block; }
  .panel h2 { margin: 2px 0 12px; font-size: 24px; letter-spacing: .05em; text-transform: uppercase; }

  .mbtn {
    width: 100%; min-height: 58px; margin-top: 10px; padding: 0 18px; box-sizing: border-box;
    display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer;
    font-size: 18px; color: #fff; border-radius: 16px;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2);
    outline: none; transition: background .12s ease, transform .08s ease;
  }
  .mbtn svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .mbtn:hover { background: rgba(255, 255, 255, .15); }
  .mbtn:active { transform: scale(.98); }
  .mbtn:focus-visible { box-shadow: 0 0 0 3px #fff; }
  .mbtn.primary { background: #ffb000; border-color: #ffd36b; color: #14202c; font-weight: 700; }
  .mbtn.primary:hover { background: #ffc233; }
  .mbtn:disabled { opacity: .4; cursor: not-allowed; }
  .mbtn:disabled:hover { background: rgba(255, 255, 255, .08); }
  .mbtn em { margin-left: auto; font-style: normal; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }

  .ghead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ghead h2 { margin: 0; }
  .back, .nav {
    width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer; flex: none;
    border: 1.5px solid rgba(255, 255, 255, .35); background: rgba(14, 26, 40, .6); color: #fff;
    display: grid; place-items: center; outline: none;
  }
  .back svg, .nav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .back:active, .nav:active { background: #ffb000; color: #14202c; }
  .back:focus-visible, .nav:focus-visible { box-shadow: 0 0 0 3px #fff; }
  .stage {
    position: relative; border-radius: 18px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 75%, #3d587a 0%, #1b2b3d 72%);
  }
  #preview { position: relative; inset: auto; z-index: auto; display: block; width: 100%; height: clamp(150px, 26vh, 230px); touch-action: pan-y; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); }
  .nav.prev { left: 8px; }
  .nav.next { right: 8px; }
  .cname { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .cname strong { font-size: 20px; }
  #carDots { display: flex; gap: 6px; }
  #carDots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .25); }
  #carDots i.on { background: #ffb000; }
  #carDesc { margin: 4px 0 12px; font-size: 14px; line-height: 1.35; color: rgba(255, 255, 255, .78); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .sw { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); cursor: pointer; outline: none; }
  .sw.sel { box-shadow: 0 0 0 2px #14202c, 0 0 0 4px #ffb000; }
  .sw:focus-visible { box-shadow: 0 0 0 3px #fff; }
  .stat { display: grid; grid-template-columns: 96px 1fr 22px; align-items: center; gap: 10px; margin: 7px 0; font-size: 14px; }
  .bar { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #ffb000, #ffd36b); transition: width .35s ease; }
  .stat b { text-align: right; font-variant-numeric: tabular-nums; }

  .toggles {
    position: fixed; z-index: 8; display: flex; gap: 10px;
    right: max(14px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top));
  }
  .tgl {
    width: 46px; height: 46px; padding: 0; border-radius: 14px; cursor: pointer;
    background: rgba(14, 26, 40, .62); color: #ffb000;
    border: 1.5px solid rgba(255, 255, 255, .3);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center; outline: none; touch-action: manipulation;
  }
  .tgl svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tgl .slash { display: none; }
  .tgl.off { color: rgba(255, 255, 255, .6); }
  .tgl.off .slash { display: block; }
  .tgl:focus-visible { box-shadow: 0 0 0 3px #fff; }

  .pad {
    position: fixed; z-index: 3; display: flex; gap: 14px;
    bottom: max(18px, env(safe-area-inset-bottom));
    --k: clamp(66px, 17vmin, 96px);
  }
  .padL { left: max(18px, env(safe-area-inset-left)); flex-direction: row; }
  .padR { right: max(18px, env(safe-area-inset-right)); flex-direction: column; }

  .key {
    width: var(--k); height: var(--k); padding: 0; border-radius: 22px; cursor: pointer;
    background: rgba(14, 26, 40, .58); color: #fff;
    border: 1.5px solid rgba(255, 255, 255, .38);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center; outline: none;
    touch-action: none; transition: transform .08s ease, background .08s ease, color .08s ease;
  }
  .key svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .key.pressed { background: #ffb000; color: #14202c; border-color: #ffd36b; transform: scale(.94); }
  .key:focus-visible { box-shadow: 0 0 0 3px #fff; }

  /* ---------- settings rows ---------- */
  .srow { display: flex; align-items: center; gap: 12px; margin: 13px 0; font-size: 15px; }
  .srow > label { flex: none; width: 112px; color: rgba(255, 255, 255, .85); }
  .srow output { flex: none; width: 34px; text-align: right; font-variant-numeric: tabular-nums; opacity: .8; font-size: 13px; }
  input[type="range"] { flex: 1; appearance: none; -webkit-appearance: none; height: 8px; border-radius: 4px;
    background: rgba(255, 255, 255, .14); outline: none; cursor: pointer; margin: 0; }
  input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #ffb000; border: 2px solid #14202c; box-shadow: 0 0 0 2px #ffd36b; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #ffb000; border: 2px solid #14202c; cursor: pointer; }
  input[type="range"]:focus-visible { box-shadow: 0 0 0 3px #fff; }
  .pill { margin-left: auto; flex: none; width: 52px; height: 28px; border-radius: 14px; cursor: pointer;
    border: 1.5px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); position: relative;
    transition: background .15s ease; outline: none; padding: 0; }
  .pill::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: transform .15s ease; }
  .pill.on { background: #ffb000; border-color: #ffd36b; }
  .pill.on::after { transform: translateX(24px); }
  .pill:focus-visible { box-shadow: 0 0 0 3px #fff; }

  /* ---------- damage dots ---------- */
  #dmg { display: inline-flex; gap: 5px; align-items: center; padding-left: 12px; margin-left: 4px;
    border-left: 1px solid rgba(255, 255, 255, .25); }
  #dmg i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .22);
    transition: background .25s ease, box-shadow .25s ease, transform .25s ease; }
  #dmg i.hit { background: #ff5a3c; box-shadow: 0 0 9px rgba(255, 90, 60, .85); transform: scale(1.15); }

  body.is-wrecked .toggles, body.is-wrecked .pad { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="hud"><span id="spd">0</span><span class="u">km/h</span><span id="dmg" title="Damage"><i></i><i></i><i></i></span></div>
<div id="hint">Hold ▲ to drive · Space = handbrake · Arrow keys work too.</div>

<div class="overlay" id="pause" role="dialog" aria-modal="true" aria-label="Pause menu">
  <div class="panel">
    <section class="view show" id="menuView">
      <h2>Paused</h2>
      <button class="mbtn primary" id="btnContinue" type="button">
        <svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg><span>Continue</span>
      </button>
      <button class="mbtn" id="btnSettings" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span>
      </button>
      <button class="mbtn" id="btnGarage" type="button">
        <svg viewBox="0 0 24 24"><path d="M5 15l1.6-4.6A2 2 0 018.5 9h7a2 2 0 011.9 1.4L19 15"/><path d="M4 15h16v3.5H4z"/><path d="M7 18.5V20M17 18.5V20"/></svg><span>Car selection</span>
      </button>
      <button class="mbtn" id="btnRefresh" type="button">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.4-5.7"/><path d="M20 4v5h-5"/></svg><span>Refresh</span>
      </button>
    </section>

    <section class="view" id="garageView">
      <div class="ghead">
        <button class="back" id="btnBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7"/></svg></button>
        <h2>Car selection</h2>
      </div>
      <div class="stage">
        <canvas id="preview"></canvas>
        <button class="nav prev" id="carPrev" type="button" aria-label="Previous car"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7"/></svg></button>
        <button class="nav next" id="carNext" type="button" aria-label="Next car"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7"/></svg></button>
      </div>
      <div class="cname"><strong id="carName"></strong><span id="carDots"></span></div>
      <p id="carDesc"></p>
      <div class="swatches" id="swatches" role="radiogroup" aria-label="Car colour"></div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="view" id="settingsView">
      <div class="ghead">
        <button class="back" id="btnSetBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7"/></svg></button>
        <h2>Settings</h2>
      </div>
      <div class="srow"><label for="volMusic">Music</label><input type="range" id="volMusic" min="0" max="100" step="1" value="100"><output id="volMusicV">100</output></div>
      <div class="srow"><label for="volSfx">Sound effects</label><input type="range" id="volSfx" min="0" max="100" step="1" value="100"><output id="volSfxV">100</output></div>
      <div class="srow"><label>Shadows</label><button class="pill on" id="pillShadows" type="button" role="switch" aria-checked="true" aria-label="Shadows"></button></div>
      <div class="srow"><label>Skid marks</label><button class="pill on" id="pillMarks" type="button" role="switch" aria-checked="true" aria-label="Skid marks"></button></div>
      <div class="srow"><label>Camera shake</label><button class="pill on" id="pillShake" type="button" role="switch" aria-checked="true" aria-label="Camera shake"></button></div>
    </section>
  </div>
</div>

<div class="overlay" id="wreck" role="dialog" aria-modal="true" aria-label="Wrecked">
  <div class="panel">
    <h2 style="color:#ff5a3c">Wrecked!</h2>
    <p style="margin:0 0 4px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.8)">You crashed 3 times and the car is on fire.</p>
    <button class="mbtn primary" id="btnRestart" type="button">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.4-5.7"/><path d="M20 4v5h-5"/></svg><span>Restart</span>
    </button>
  </div>
</div>

<div class="toggles">
  <button class="tgl" id="tglPause" type="button" aria-pressed="false" aria-label="Pause menu" title="Pause (Esc)">
    <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke-width="2.8"/></svg>
  </button>
  <button class="tgl" id="tglMusic" type="button" aria-pressed="true" aria-label="Music" title="Music">
    <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="16" r="2.2"/><path class="slash" d="M4 4l16 16"/></svg>
  </button>
  <button class="tgl" id="tglSfx" type="button" aria-pressed="true" aria-label="Sound effects" title="Sound effects">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.5a8 8 0 010 11"/><path class="slash" d="M4 4l16 16"/></svg>
  </button>
</div>

<div class="pad padL">
  <button class="key" data-k="left" type="button" aria-label="Steer left"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7"/></svg></button>
  <button class="key" data-k="hb" type="button" aria-label="Handbrake" title="Handbrake (Space)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M10 17V7h3.4a2.7 2.7 0 010 5.4H10"/></svg></button>
  <button class="key" data-k="right" type="button" aria-label="Steer right"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7"/></svg></button>
</div>
<div class="pad padR">
  <button class="key" data-k="up" type="button" aria-label="Accelerate"><svg viewBox="0 0 24 24"><path d="M5 15l7-8 7 8"/></svg></button>
  <button class="key" data-k="down" type="button" aria-label="Brake and reverse"><svg viewBox="0 0 24 24"><path d="M5 9l7 8 7-8"/></svg></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     Helpers
  --------------------------------------------------------------- */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rng = (function (a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  })(20240611);
  const rr = (a, b) => a + (b - a) * rng();
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const ur = (a, b) => a + (b - a) * Math.random();      // true random (spawn points)
  const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));

  /* settings (persisted) */
  const settings = (() => {
    const def = { music: 100, sfx: 100, shadows: true, marks: true, shake: true };
    try { return Object.assign(def, JSON.parse(localStorage.getItem('citydrive.settings') || '{}')); }
    catch (_) { return def; }
  })();
  function saveSettings() { try { localStorage.setItem('citydrive.settings', JSON.stringify(settings)); } catch (_) {} }

  /* ---------------------------------------------------------------
     Renderer / scene / camera
  --------------------------------------------------------------- */
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const SKY = 0xbcd5e8;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 170, 430);

  const camera = new THREE.PerspectiveCamera(46, 1, 4, 700);

  const hemi = new THREE.HemisphereLight(0xdfeaff, 0x8a9a6a, 0.62);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d2, 0.9);
  sun.castShadow = settings.shadows;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera;
  sc.left = -95; sc.right = 95; sc.top = 95; sc.bottom = -95; sc.near = 1; sc.far = 400;
  sun.shadow.bias = -0.0006;
  scene.add(sun); scene.add(sun.target);
  const SUN_OFFSET = new THREE.Vector3(-70, 120, 55);
  // preallocated helpers that snap the shadow camera to whole texels,
  // so the shadow map never shimmers or pops as you drive around
  const _lightView = new THREE.Matrix4();
  const _lightInv = new THREE.Matrix4();
  const _snapP = new THREE.Vector3();
  const _upVec = new THREE.Vector3(0, 1, 0);

  /* ---------------------------------------------------------------
     City layout constants
  --------------------------------------------------------------- */
  const N = 4;            // blocks per side
  const B = 40;           // block size
  const R = 14;           // road width
  const P = B + R;        // pitch
  const HALF = (N * P + R) / 2;   // 115
  const SW = 0.4;         // sidewalk height
  const rc = i => -HALF + R / 2 + i * P;       // road centre line
  const bc = i => -HALF + R + B / 2 + i * P;   // block centre

  const colliders = [];
  const matCache = {};
  function lam(c) { return matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c })); }
  function box(w, h, d, x, y, z, color, cast, recv) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lam(color));
    m.position.set(x, y, z);
    m.castShadow = cast !== false;
    m.receiveShadow = recv !== false;
    scene.add(m);
    return m;
  }
  function addCollider(cx, cz, w, d) {
    const col = { minX: cx - w / 2, maxX: cx + w / 2, minZ: cz - d / 2, maxZ: cz + d / 2 };
    colliders.push(col);
    return col;
  }

  /* ---------------------------------------------------------------
     Ground, asphalt, markings
  --------------------------------------------------------------- */
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600).rotateX(-Math.PI / 2), lam(0x9dbb86));
  ground.position.y = -0.06; ground.receiveShadow = true; scene.add(ground);

  const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, HALF * 2).rotateX(-Math.PI / 2), lam(0x3d4551));
  asphalt.position.y = 0.01; asphalt.receiveShadow = true; scene.add(asphalt);

  (function markings() {
    const dummy = new THREE.Object3D();
    const dashGeo = new THREE.PlaneGeometry(0.3, 3).rotateX(-Math.PI / 2);
    const zebraGeo = new THREE.PlaneGeometry(0.7, 2.6).rotateX(-Math.PI / 2);
    const dashMat = new THREE.MeshLambertMaterial({ color: 0xe9c94e });
    const zebraMat = new THREE.MeshLambertMaterial({ color: 0xe9e7df });

    const dashes = [], zebras = [];
    const nearIntersection = v => { for (let k = 0; k <= N; k++) if (Math.abs(v - rc(k)) < R / 2 + 2.5) return true; return false; };

    for (let i = 0; i <= N; i++) {
      for (let t = -HALF + 1.5; t < HALF; t += 6) {
        if (nearIntersection(t)) continue;
        dashes.push([rc(i), t, 0]);       // vertical road
        dashes.push([t, rc(i), Math.PI / 2]); // horizontal road
      }
    }
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
      const ix = rc(i), iz = rc(j), off = R / 2 + 2.2;
      const sides = [
        [0, -1, j > 0], [0, 1, j < N], [-1, 0, i > 0], [1, 0, i < N]
      ];
      for (const [sx, sz, ok] of sides) {
        if (!ok) continue;
        for (let s = -5.6; s <= 5.61; s += 1.4) {
          if (sx === 0) zebras.push([ix + s, iz + sz * off, 0]);
          else zebras.push([ix + sx * off, iz + s, Math.PI / 2]);
        }
      }
    }
    function inst(geo, mat, list, y) {
      const m = new THREE.InstancedMesh(geo, mat, list.length);
      list.forEach((d, k) => {
        dummy.position.set(d[0], y, d[1]); dummy.rotation.set(0, d[2], 0); dummy.updateMatrix();
        m.setMatrixAt(k, dummy.matrix);
      });
      m.receiveShadow = true; scene.add(m);
    }
    inst(dashGeo, dashMat, dashes, 0.035);
    inst(zebraGeo, zebraMat, zebras, 0.035);
  })();

  /* ---------------------------------------------------------------
     Window texture + buildings
  --------------------------------------------------------------- */
  const winTex = (function () {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#f1ede4'; g.fillRect(0, 0, 128, 128);
    for (let r = 0; r < 2; r++) for (let k = 0; k < 4; k++) {
      const x = k * 32 + 6, y = r * 64 + 14, w = 20, h = 36;
      const grad = g.createLinearGradient(0, y, 0, y + h);
      if (rng() < 0.16) { grad.addColorStop(0, '#f6dc96'); grad.addColorStop(1, '#e2b865'); }
      else { grad.addColorStop(0, '#6c8dab'); grad.addColorStop(1, '#27394b'); }
      g.fillStyle = grad; g.fillRect(x, y, w, h);
      g.fillStyle = '#c9c1b2'; g.fillRect(x - 2, y + h, w + 4, 3);
      g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x + 2, y + 2, 4, h - 4);
    }
    g.fillStyle = 'rgba(0,0,0,.10)'; g.fillRect(0, 60, 128, 4); g.fillRect(0, 124, 128, 4);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return t;
  })();

  const facadeCache = {};
  function facade(tint) {
    return facadeCache[tint] || (facadeCache[tint] = new THREE.MeshLambertMaterial({ map: winTex, color: tint }));
  }
  const TINTS = [0xd8d2c4, 0xc9b8a6, 0xb8c4cc, 0xe0c9a6, 0xa9b7a0, 0xc7a99b, 0x9fb2c9, 0xdcdcdc, 0xc3a38a, 0x93a3b8, 0xd9b9a0];
  const TRIMS = [0x8d8a84, 0x6f7479, 0xa07a63, 0x7c8a78, 0x5f6a78, 0x9c6f5a];

  function building(cx, cz, w, d, h, tint, trim) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const uv = geo.attributes.uv;
    const ruD = Math.max(1, Math.round(d / 12)), ruW = Math.max(1, Math.round(w / 12));
    const rv = Math.max(1, Math.round(h / 6.4));
    for (let i = 0; i < 24; i++) {
      const face = Math.floor(i / 4);
      if (face === 0 || face === 1) uv.setXY(i, uv.getX(i) * ruD, uv.getY(i) * rv);
      else if (face === 4 || face === 5) uv.setXY(i, uv.getX(i) * ruW, uv.getY(i) * rv);
    }
    uv.needsUpdate = true;
    const mesh = new THREE.Mesh(geo, facade(tint));
    mesh.position.set(cx, SW + h / 2, cz);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);

    const top = SW + h;
    box(w + 0.5, 0.8, d + 0.5, cx, top - 0.1, cz, trim);       // parapet
    const nAC = 1 + Math.floor(rng() * 3);
    for (let k = 0; k < nAC; k++) {
      const aw = rr(1.4, 3), ah = rr(0.8, 1.5), ad = rr(1.4, 3);
      box(aw, ah, ad, cx + rr(-w / 3, w / 3), top + 0.3 + ah / 2, cz + rr(-d / 3, d / 3), 0x9ea4aa);
    }
    if (h > 26) {
      const a = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 7, 5), lam(0x555b63));
      a.position.set(cx, top + 3.8, cz); a.castShadow = true; scene.add(a);
    }
    addCollider(cx, cz, w, d);
  }

  /* ---------------------------------------------------------------
     Trees (instanced)
  --------------------------------------------------------------- */
  const trees = [];
  function addTree(x, z, y, s, collide) {
    trees.push({ x, z, y, s });
    if (collide) { const h = 0.55 * s; colliders.push({ minX: x - h, maxX: x + h, minZ: z - h, maxZ: z + h }); }
  }
  function buildTrees() {
    const trunkGeo = new THREE.CylinderGeometry(0.22, 0.32, 1.8, 6).translate(0, 0.9, 0);
    const canopyGeo = new THREE.IcosahedronGeometry(1.9, 0).translate(0, 3.4, 0);
    const trunks = new THREE.InstancedMesh(trunkGeo, lam(0x6b4f3a), trees.length);
    const canopies = new THREE.InstancedMesh(canopyGeo,
      new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true, shininess: 0, specular: 0x000000 }), trees.length);
    const greens = [0x5b9a4a, 0x6aaa52, 0x4e8a45, 0x78b256, 0x5f9f5a, 0xb8a040];
    const d = new THREE.Object3D(); const col = new THREE.Color();
    trees.forEach((t, i) => {
      d.position.set(t.x, t.y, t.z); d.rotation.set(0, rng() * 6.28, 0); d.scale.setScalar(t.s); d.updateMatrix();
      trunks.setMatrixAt(i, d.matrix); canopies.setMatrixAt(i, d.matrix);
      col.setHex(pick(greens)); canopies.setColorAt(i, col);
    });
    canopies.instanceColor.needsUpdate = true;
    [trunks, canopies].forEach(m => { m.castShadow = true; m.receiveShadow = true; scene.add(m); });
  }

  /* ---------------------------------------------------------------
     Blocks
  --------------------------------------------------------------- */
  function buildPark(cx, cz) {
    // paths
    box(B - 4, 0.05, 3, cx, SW + 0.03, cz, 0xe6dcc3, false, true);
    box(3, 0.05, B - 4, cx, SW + 0.03, cz, 0xe6dcc3, false, true);
    // pond
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(7.2, 7.2, 0.3, 36), lam(0xcdc6b8));
    rim.position.set(cx, SW + 0.15, cz); rim.receiveShadow = true; rim.castShadow = true; scene.add(rim);
    const water = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.2, 0.1, 36),
      new THREE.MeshPhongMaterial({ color: 0x5aa5d6, shininess: 80, specular: 0x88aacc }));
    water.position.set(cx, SW + 0.32, cz); water.receiveShadow = true; scene.add(water);
    addCollider(cx, cz, 11, 11);
    for (let k = 0; k < 22; k++) {
      const x = cx + rr(-B / 2 + 3, B / 2 - 3), z = cz + rr(-B / 2 + 3, B / 2 - 3);
      if (Math.abs(x - cx) < 3.2 || Math.abs(z - cz) < 3.2) continue;
      if (Math.hypot(x - cx, z - cz) < 10) continue;
      addTree(x, z, SW, rr(0.85, 1.3), true);
    }
  }

  function buildBlock(cx, cz) {
    const dist = Math.hypot(cx, cz);
    const downtown = dist < 50;
    const tall = Math.max(0, 1 - dist / 125);

    if (!downtown && rng() < 0.16) {           // one large low building
      const w = B - 6 - rr(0, 2), d = B - 6 - rr(0, 2);
      building(cx, cz, w, d, rr(7, 11), pick(TINTS), pick(TRIMS));
      return;
    }
    const lot = (B - 6 - 2) / 2;
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) {
      const lx = cx - B / 2 + 3 + a * (lot + 2) + lot / 2;
      const lz = cz - B / 2 + 3 + b * (lot + 2) + lot / 2;
      if (!downtown && rng() < 0.12) {          // pocket garden
        box(lot, 0.12, lot, lx, SW + 0.06, lz, 0x86b36a, false, true);
        for (let k = 0; k < 3; k++) addTree(lx + rr(-5, 5), lz + rr(-5, 5), SW + 0.1, rr(0.8, 1.15), true);
        continue;
      }
      const w = lot - rr(0, 3), d = lot - rr(0, 3);
      const ox = rr(-(lot - w) / 2, (lot - w) / 2), oz = rr(-(lot - d) / 2, (lot - d) / 2);
      const h = downtown ? rr(18, 36) : rr(6, 10 + tall * 22);
      building(lx + ox, lz + oz, w, d, h, pick(TINTS), pick(TRIMS));
    }
  }

  function streetTrees(cx, cz, isPark) {
    if (isPark) return;
    for (const side of [-1, 1]) for (const t of [-12, 12]) {
      if (rng() < 0.55) {
        addTree(cx + side * (B / 2 - 1.4), cz + t, SW, rr(0.75, 1.0), true);
      }
      if (rng() < 0.55) {
        addTree(cx + t, cz + side * (B / 2 - 1.4), SW, rr(0.75, 1.0), true);
      }
    }
  }

  /* ---------------------------------------------------------------
     Car factory
  --------------------------------------------------------------- */
  // realistic licence plates: a few variants, picked per car
  const plateMats = (function () {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const list = [];
    for (let v = 0; v < 8; v++) {
      const c = document.createElement('canvas'); c.width = 128; c.height = 32;
      const g = c.getContext('2d');
      g.fillStyle = '#e9e9e4'; g.fillRect(0, 0, 128, 32);
      g.strokeStyle = '#232323'; g.lineWidth = 4; g.strokeRect(2, 2, 124, 28);
      g.fillStyle = '#181818';
      g.font = 'bold 21px "Arial Narrow", Arial, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      let s = '';
      for (let i = 0; i < 3; i++) s += chars[Math.floor(Math.random() * 36)];
      s += '-';
      for (let i = 0; i < 3; i++) s += chars[Math.floor(Math.random() * 36)];
      g.fillText(s, 64, 18);
      const t = new THREE.CanvasTexture(c);
      t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
      list.push(new THREE.MeshBasicMaterial({ map: t }));
    }
    return list;
  })();

  const CAR_MODELS = {
    coupe: {
      name: 'Street Coupe', desc: 'Fast and low. Loves open roads, but it slides when pushed hard.',
      len: 4.3, w: 1.9, bodyH: 0.5, bodyY: 0.6, cabW: 1.62, cabH: 0.5, cabL: 2.0, cabZ: -0.15,
      roofL: 1.7, roofZ: -0.2, wheelX: 0.93, wheelZ: 1.38, wheelR: 0.39, spoiler: true, stripes: true,
      stats: { speed: 9, accel: 9, handling: 7, brake: 8, grip: 6, stability: 5 }
    },
    sedan: {
      name: 'Family Sedan', desc: 'Calm, planted and easy to drive. Hard to unsettle.',
      len: 4.7, w: 1.85, bodyH: 0.52, bodyY: 0.62, cabW: 1.6, cabH: 0.56, cabL: 2.3, cabZ: -0.3,
      roofL: 1.95, roofZ: -0.33, wheelX: 0.92, wheelZ: 1.52, wheelR: 0.38, spoiler: false, stripes: false,
      stats: { speed: 6, accel: 5, handling: 6, brake: 6, grip: 7, stability: 8 }
    },
    hatch: {
      name: 'City Hatch', desc: 'Small and nimble. Turns on a coin, but runs out of top speed early.',
      len: 3.7, w: 1.75, bodyH: 0.56, bodyY: 0.66, cabW: 1.55, cabH: 0.64, cabL: 2.05, cabZ: -0.3,
      roofL: 1.85, roofZ: -0.35, wheelX: 0.86, wheelZ: 1.12, wheelR: 0.36, spoiler: false, stripes: false,
      stats: { speed: 4, accel: 6, handling: 9, brake: 7, grip: 8, stability: 4 }
    }
  };
  const MODEL_KEYS = ['coupe', 'sedan', 'hatch'];

  // wheel geometries are shared between every car of the same model
  const wheelGeoCache = {};
  function wheelGeos(R) {
    const k = R.toFixed(2);
    let g = wheelGeoCache[k];
    if (!g) {
      g = {
        tyre: new THREE.CylinderGeometry(R, R, 0.3, 18),
        rim: new THREE.CylinderGeometry(R * 0.62, R * 0.62, 0.32, 10),
        spoke: new THREE.BoxGeometry(0.34, R * 1.28, 0.06)
      };
      for (const key in g) g[key].userData.shared = true;
      wheelGeoCache[k] = g;
    }
    return g;
  }

  function makeCar(opts) {
    const M = CAR_MODELS[opts.model || 'coupe'];
    const g = new THREE.Group();
    const chassis = new THREE.Group(); g.add(chassis);
    const bodyMat = new THREE.MeshStandardMaterial({ color: opts.color, roughness: 0.38, metalness: 0.2 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x1b2733, roughness: 0.15, metalness: 0.5 });
    const darkMat = lam(0x15171a);
    function add(parent, geo, mat, x, y, z) {
      const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
      m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
    }
    const bodyTop = M.bodyY + M.bodyH / 2;
    const roofTop = bodyTop + M.cabH + 0.07;
    add(chassis, new THREE.BoxGeometry(M.w, M.bodyH, M.len), bodyMat, 0, M.bodyY, 0);
    add(chassis, new THREE.BoxGeometry(M.cabW, M.cabH, M.cabL), glassMat, 0, bodyTop + M.cabH / 2, M.cabZ);
    add(chassis, new THREE.BoxGeometry(M.cabW - 0.12, 0.07, M.roofL), bodyMat, 0, bodyTop + M.cabH + 0.035, M.roofZ);
    [1, -1].forEach(sz => add(chassis, new THREE.BoxGeometry(M.w + 0.06, 0.2, 0.16), darkMat, 0, M.bodyY - 0.15, sz * (M.len / 2 + 0.01)));

    const out = { group: g, chassis, wheels: [], steerPivots: [], bodyMat, model: M, stripeMat: null, tailMat: null, indMat: null };
    out.setColor = function (hex) {
      bodyMat.color.setHex(hex);
      if (out.stripeMat) {
        const r = (hex >> 16) & 255, gg = (hex >> 8) & 255, b = hex & 255;
        const lum = (0.299 * r + 0.587 * gg + 0.114 * b) / 255;
        out.stripeMat.color.setHex(lum > 0.72 ? 0x2b2f36 : 0xf4f1ea);
      }
    };

    if (opts.detailed) {
      if (M.stripes) {
        out.stripeMat = new THREE.MeshLambertMaterial({ color: 0xf4f1ea });
        const cabFront = M.cabZ + M.cabL / 2, cabRear = M.cabZ - M.cabL / 2;
        const hoodLen = M.len / 2 - cabFront - 0.1, trunkLen = M.len / 2 + cabRear - 0.1;
        [-0.15, 0.15].forEach(x => {
          add(chassis, new THREE.BoxGeometry(0.14, 0.012, hoodLen), out.stripeMat, x, bodyTop + 0.007, (cabFront + M.len / 2) / 2);
          add(chassis, new THREE.BoxGeometry(0.14, 0.012, M.roofL), out.stripeMat, x, roofTop + 0.005, M.roofZ);
          add(chassis, new THREE.BoxGeometry(0.14, 0.012, trunkLen), out.stripeMat, x, bodyTop + 0.007, (cabRear - M.len / 2) / 2);
        });
      }
      if (M.spoiler) {
        add(chassis, new THREE.BoxGeometry(M.w - 0.2, 0.06, 0.5), darkMat, 0, bodyTop + 0.27, -(M.len / 2 - 0.2));
        [-0.6, 0.6].forEach(x => add(chassis, new THREE.BoxGeometry(0.06, 0.24, 0.1), darkMat, x, bodyTop + 0.13, -(M.len / 2 - 0.25)));
      }

      const lightsOn = opts.lightsOn !== false;
      const head = new THREE.MeshBasicMaterial({ color: lightsOn ? 0xfff6c8 : 0x4a4a42 });
      [-1, 1].forEach(sx => add(chassis, new THREE.BoxGeometry(0.4, 0.14, 0.08), head, sx * M.w * 0.325, M.bodyY + 0.06, M.len / 2 + 0.02));
      out.tailMat = new THREE.MeshBasicMaterial({ color: lightsOn ? 0x8a1212 : 0x4a1010 });
      [-1, 1].forEach(sx => add(chassis, new THREE.BoxGeometry(0.46, 0.13, 0.08), out.tailMat, sx * M.w * 0.34, M.bodyY + 0.08, -(M.len / 2 + 0.02)));

      // turn indicators (amber) — blink when the car signals
      out.indMat = new THREE.MeshBasicMaterial({ color: 0x6b4a12 });
      [-1, 1].forEach(sx => {
        add(chassis, new THREE.BoxGeometry(0.15, 0.11, 0.07), out.indMat, sx * (M.w / 2 - 0.09), M.bodyY + 0.1, M.len / 2 + 0.04);
        add(chassis, new THREE.BoxGeometry(0.15, 0.11, 0.07), out.indMat, sx * (M.w / 2 - 0.09), M.bodyY + 0.1, -(M.len / 2 + 0.04));
      });

      // licence plates (different random plate on every car)
      const plateMat = plateMats[Math.floor(Math.random() * plateMats.length)];
      add(chassis, new THREE.BoxGeometry(0.62, 0.17, 0.05), plateMat, 0, M.bodyY - 0.03, M.len / 2 + 0.095);
      add(chassis, new THREE.BoxGeometry(0.62, 0.17, 0.05), plateMat, 0, M.bodyY - 0.03, -(M.len / 2 + 0.095));

      const R = M.wheelR;
      const WG = wheelGeos(R);
      const tyreMat = lam(0x1a1c1f), rimMat = lam(0xc9ccd1);
      [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sz]) => {
        const steer = new THREE.Group(); steer.position.set(sx * M.wheelX, R, sz * M.wheelZ);
        const spin = new THREE.Group(); steer.add(spin);
        const t = add(spin, WG.tyre, tyreMat, 0, 0, 0); t.rotation.z = Math.PI / 2;
        const r = add(spin, WG.rim, rimMat, 0, 0, 0); r.rotation.z = Math.PI / 2;
        add(spin, WG.spoke, darkMat, 0, 0, 0);
        g.add(steer);
        out.wheels.push(spin);
        if (sz > 0) out.steerPivots.push(steer);
      });

      if (opts.ghost !== false) {
        // Silhouette that only shows when a building hides the car
        const ghostMat = new THREE.MeshBasicMaterial({
          color: 0xffe066, transparent: true, opacity: 0.5,
          depthFunc: THREE.GreaterDepth, depthWrite: false, fog: false
        });
        const gTop = roofTop + 0.15, gBot = 0.25;
        const ghost = new THREE.Mesh(new THREE.BoxGeometry(M.w + 0.34, gTop - gBot, M.len + 0.2), ghostMat);
        ghost.position.y = (gTop + gBot) / 2; ghost.renderOrder = 20; chassis.add(ghost);
      }
    } else {
      const tyreMat = lam(0x1a1c1f);
      [-1, 1].forEach(sx => add(g, new THREE.BoxGeometry(0.3, M.wheelR * 1.8, M.len * 0.76), tyreMat, sx * (M.w / 2 - 0.02), M.wheelR * 0.92, 0));
    }
    out.setColor(opts.color);
    return out;
  }

  // parked cars live in their own group so they can be re-shuffled on restart
  const parkedGroup = new THREE.Group();
  scene.add(parkedGroup);
  const parkedList = [];
  const parkedCols = [];
  const PARKED_COLORS = [0x8a9099, 0x3f5b7a, 0xb8b4aa, 0x7a3b3b, 0x2f3b36, 0xc9b27a, 0x5a6f8c, 0xe2e0da];
  function parkedCars(cx, cz) {
    const R = Math.random;
    for (const side of [-1, 1]) for (const t of [-9.5, 9.5]) {
      if (R() > 0.26) continue;
      const along = R() < 0.5 ? 0 : Math.PI;
      const off = B / 2 + 1.35;
      const model = MODEL_KEYS[Math.floor(R() * MODEL_KEYS.length)];
      const color = PARKED_COLORS[Math.floor(R() * PARKED_COLORS.length)];
      // west / east curbs (cars point along Z)
      if (R() < 0.5) {
        const c = makeCar({ color, detailed: true, ghost: false, lightsOn: false, model });
        c.group.position.set(cx + side * off, 0, cz + t); c.group.rotation.y = along;
        parkedGroup.add(c.group);
        parkedCols.push(addCollider(cx + side * off, cz + t, 2.0, 4.4));
        parkedList.push(c);
      } else {
        const c = makeCar({ color, detailed: true, ghost: false, lightsOn: false, model });
        c.group.position.set(cx + t, 0, cz + side * off); c.group.rotation.y = along + Math.PI / 2;
        parkedGroup.add(c.group);
        parkedCols.push(addCollider(cx + t, cz + side * off, 4.4, 2.0));
        parkedList.push(c);
      }
    }
  }
  // move the parked cars to new random curb spots (fresh layout on every restart)
  function reshuffleParked() {
    for (const c of parkedList) { parkedGroup.remove(c.group); disposeCar(c); }
    parkedList.length = 0;
    for (const col of parkedCols) {
      const idx = colliders.indexOf(col);
      if (idx >= 0) colliders.splice(idx, 1);
    }
    parkedCols.length = 0;
    for (let bi = 0; bi < N; bi++) for (let bj = 0; bj < N; bj++) parkedCars(bc(bi), bc(bj));
  }

  /* ---------------------------------------------------------------
     Build the city
  --------------------------------------------------------------- */
  const parks = new Set(['1,2', '2,1']);
  for (let bi = 0; bi < N; bi++) for (let bj = 0; bj < N; bj++) {
    const cx = bc(bi), cz = bc(bj);
    const isPark = parks.has(bi + ',' + bj);
    box(B, SW, B, cx, SW / 2, cz, isPark ? 0x86b36a : 0xcdc6b8, false, true);
    if (isPark) buildPark(cx, cz); else buildBlock(cx, cz);
    streetTrees(cx, cz, isPark);
    parkedCars(cx, cz);
  }

  // perimeter hedge walls
  (function walls() {
    const T = 4, L = HALF * 2 + T * 2;
    const defs = [
      [0, -HALF - T / 2, L, T], [0, HALF + T / 2, L, T],
      [-HALF - T / 2, 0, T, HALF * 2], [HALF + T / 2, 0, T, HALF * 2]
    ];
    defs.forEach(([x, z, w, d]) => {
      box(w, 1.8, d, x, 0.9, z, 0x4f7d44);
      addCollider(x, z, w, d);
    });
  })();

  // scenery beyond the walls
  for (let k = 0; k < 120; k++) {
    const a = rng() * Math.PI * 2, rad = rr(HALF + 12, HALF + 90);
    const x = clamp(Math.cos(a) * rad * 1.1, -HALF - 110, HALF + 110), z = clamp(Math.sin(a) * rad * 1.1, -HALF - 110, HALF + 110);
    if (Math.abs(x) < HALF + 8 && Math.abs(z) < HALF + 8) continue;
    addTree(x, z, 0, rr(1, 1.8), false);
  }
  buildTrees();

  /* ---------------------------------------------------------------
     Player car + skid marks
  --------------------------------------------------------------- */
  let player = null;

  const MAX_MARKS = 1400;
  const markGeo = new THREE.PlaneGeometry(0.3, 1).rotateX(-Math.PI / 2);
  const markMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32, depthWrite: false });
  const marks = new THREE.InstancedMesh(markGeo, markMat, MAX_MARKS);
  const mDummy = new THREE.Object3D();
  mDummy.scale.setScalar(0); mDummy.updateMatrix();
  for (let i = 0; i < MAX_MARKS; i++) marks.setMatrixAt(i, mDummy.matrix);
  marks.frustumCulled = false; marks.renderOrder = 2;
  scene.add(marks);
  let markIdx = 0, lastMarkX = 1e9, lastMarkZ = 1e9;
  let wheelTrail = [null, null];   // last spot of each rear wheel, so segments join up
  function dropMark(x1, z1, x2, z2) {
    // one continuous segment from (x1,z1) to (x2,z2). Consecutive segments
    // overlap a little, so the drift line is one joined ribbon, not separate dashes.
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    if (len < 1e-4) return;
    mDummy.position.set((x1 + x2) / 2, 0.045, (z1 + z2) / 2);
    mDummy.rotation.set(0, Math.atan2(dx, dz), 0);
    mDummy.scale.set(1, 1, len + 0.3);
    mDummy.updateMatrix();
    marks.setMatrixAt(markIdx, mDummy.matrix);
    markIdx = (markIdx + 1) % MAX_MARKS;
    marks.instanceMatrix.needsUpdate = true;
  }

  /* ---------------------------------------------------------------
     Input
  --------------------------------------------------------------- */
  const keysKB = { left: false, right: false, up: false, down: false, hb: false };
  const keysPtr = { left: false, right: false, up: false, down: false, hb: false };
  const keyEls = {};
  const hint = document.getElementById('hint');
  let interacted = false;
  function noteInput() { if (!interacted) { interacted = true; setTimeout(() => hint.classList.add('gone'), 1800); } }

  document.querySelectorAll('.key').forEach(el => {
    const k = el.dataset.k; keyEls[k] = el;
    const on = e => { e.preventDefault(); keysPtr[k] = true; noteInput(); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = e => { e.preventDefault(); keysPtr[k] = false; };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('lostpointercapture', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  });
  const keyMap = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'hb'
  };
  window.addEventListener('keydown', e => { const k = keyMap[e.code]; if (k) { e.preventDefault(); if (!paused && !wrecked) { keysKB[k] = true; noteInput(); } } });
  window.addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) { e.preventDefault(); keysKB[k] = false; } });
  window.addEventListener('blur', () => { for (const k in keysKB) { keysKB[k] = false; keysPtr[k] = false; } });
  const held = k => keysKB[k] || keysPtr[k];

  /* ---------------------------------------------------------------
     Audio (all synthesised with Web Audio, no files needed)
  --------------------------------------------------------------- */
  const sfx = (function () {
    let ctx = null, sfxBus, musicBus, padBus, arpSend, noiseBuf;
    let eng = null, skid = null, lastImpact = 0;
    const state = { music: true, sfx: true, musicVol: settings.music / 100, sfxVol: settings.sfx / 100 };
    const MUSIC_LEVEL = 0.55;

    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    function init() {
      if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      ctx.onstatechange = () => {
        if (ctx.state === 'running' && state.music && musicTimer) {

      const blip = ctx.createBufferSource();
      blip.buffer = ctx.createBuffer(1, 1, 22050);

      const master = ctx.createGain(); master.gain.value = 0.85;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);

      sfxBus = ctx.createGain(); sfxBus.gain.value = (state.sfx && !sfxPaused) ? state.sfxVol : 0; sfxBus.connect(master);
      musicBus = ctx.createGain(); musicBus.gain.value = state.music ? MUSIC_LEVEL * state.musicVol : 0; musicBus.connect(master);

      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

      buildEngine(); buildSkid(); buildMusicFx();
      if (state.music) startMusic();
      ctx.resume();
    }

    /* ---- engine + tyres ---- */
    function buildEngine() {
      // 4-cylinder family car: low, mellow drone with a slightly uneven idle
      const o1 = ctx.createOscillator(); o1.type = 'sawtooth';
      const o2 = ctx.createOscillator(); o2.type = 'triangle';
      const g2 = ctx.createGain(); g2.gain.value = 0.4;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.7;
      const gain = ctx.createGain(); gain.gain.value = 0;
      o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(gain); gain.connect(sfxBus);

      // gentle wobble in pitch so it doesn't sound like a pure synth
      const lfo = ctx.createOscillator(); lfo.frequency.value = 7;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = 1.4;
      lfo.connect(lfoGain); lfoGain.connect(o1.frequency); lfoGain.connect(o2.frequency);

      // soft intake / road rumble
      const nz = ctx.createBufferSource(); nz.buffer = noiseBuf; nz.loop = true;
      const nlp = ctx.createBiquadFilter(); nlp.type = 'lowpass'; nlp.frequency.value = 260;
      const ngain = ctx.createGain(); ngain.gain.value = 0;
      nz.connect(nlp); nlp.connect(ngain); ngain.connect(sfxBus);

    }
    function buildSkid() {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1600; bp.Q.value = 5;
      const bp2 = ctx.createBiquadFilter(); bp2.type = 'bandpass'; bp2.frequency.value = 700; bp2.Q.value = 3;
      const gain = ctx.createGain(); gain.gain.value = 0;
      // fast warble so a handbrake screech sounds like real tyres
      const lfo = ctx.createOscillator(); lfo.frequency.value = 31;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = 0;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain);
      src.connect(bp); bp.connect(gain);
      src.connect(bp2); bp2.connect(gain);
      gain.connect(sfxBus);
      src.start(); lfo.start();
      skid = { bp, bp2, gain, lfoGain };
    }

    const GEARS = [0, 10, 18, 26, 34, 48];   // wide gears = relaxed revs, like a normal car
    function update(speed, throttle, slip, hb) {
      if (!ctx || !eng) return;
      const t = ctx.currentTime;
      let gi = 1;
      while (gi < GEARS.length - 1 && speed > GEARS[gi]) gi++;
      const frac = clamp((speed - GEARS[gi - 1]) / (GEARS[gi] - GEARS[gi - 1]), 0, 1);
      const rpm = 0.1 + frac * 0.5 + throttle * 0.06;
      const f = 34 + rpm * 90;
      eng.o1.frequency.setTargetAtTime(f, t, 0.1);
      eng.o2.frequency.setTargetAtTime(f * 2, t, 0.1);
      eng.lp.frequency.setTargetAtTime(240 + rpm * 520 + throttle * 140, t, 0.12);
      eng.gain.gain.setTargetAtTime(0.085 + rpm * 0.04 + throttle * 0.03, t, 0.12);
      eng.ngain.gain.setTargetAtTime(0.03 + clamp(speed / 40, 0, 1) * 0.07, t, 0.15);
      // handbrake: sharper, higher-pitched screech that warbles like real tyres
      skid.gain.gain.setTargetAtTime(slip * (hb ? 0.21 : 0.15), t, 0.05);
      skid.bp.frequency.setTargetAtTime((hb ? 2350 : 1500) + slip * (hb ? 750 : 600) - speed * 10, t, 0.1);
      skid.bp.Q.setTargetAtTime(hb ? 7 : 5, t, 0.1);
      skid.bp2.frequency.setTargetAtTime(hb ? 700 + slip * 200 : 300, t, 0.1);
      skid.lfoGain.gain.setTargetAtTime(hb ? slip * 0.12 : 0, t, 0.08);
    }

    function impact(j) {
      if (!ctx || !state.sfx) return;
      const t = ctx.currentTime;
      if (t - lastImpact < 0.09) return;
      lastImpact = t;
      const v = clamp(j / 18, 0.12, 1);
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.5 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      src.connect(lp); lp.connect(g); g.connect(sfxBus);
      src.start(t, Math.random() * 0.5, 0.3);
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.2);
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.75 * v, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
      o.connect(og); og.connect(sfxBus); o.start(t); o.stop(t + 0.3);
    }

    /* ---- music: a looping Am - F - C - G groove, generated live ---- */
    const BPM = 102, STEP = 60 / BPM / 4;
    const PROG = [
      { root: 45, ch: [57, 60, 64] },
      { root: 41, ch: [53, 57, 60] },
      { root: 48, ch: [60, 64, 67] },
      { root: 43, ch: [55, 59, 62] }
    ];
    const ARP = [0, 1, 2, 3, 2, 1, 0, 1];
    let musicTimer = null, nextT = 0, stepIdx = 0;

    function buildMusicFx() {
      padBus = ctx.createGain(); padBus.gain.value = 1; padBus.connect(musicBus);
      arpSend = ctx.createGain(); arpSend.gain.value = 1; arpSend.connect(musicBus);
      const delay = ctx.createDelay(1); delay.delayTime.value = STEP * 3;
      const fb = ctx.createGain(); fb.gain.value = 0.34;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;

    }

    function note(type, freq, t, dur, peak, dest, o) {
      o = o || {};
      const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = freq;
      if (o.detune) osc.detune.value = o.detune;
      const g = ctx.createGain();
      const a = o.a || 0.005, r = o.r || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + r);
      let out = g;
      osc.connect(g);
      if (o.cutoff) {
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.cutoff;
        g.connect(f); out = f;
      }
      out.connect(dest);
      osc.start(t); osc.stop(t + dur + r + 0.05);
    }
    function noiseHit(t, type, freq, peak, dur) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(f); f.connect(g); g.connect(musicBus);
      src.start(t, Math.random() * 0.5, dur + 0.02);
    }
    function kick(t, v) {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.12);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.7 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.32);
    }

    function playStep(s, t) {
      const bar = Math.floor(s / 16) % 4, st = s % 16, c = PROG[bar];
      if (st % 4 === 0) kick(t, st === 0 ? 1 : 0.8);
      if (st === 4 || st === 12) noiseHit(t, 'bandpass', 1500, 0.22, 0.16);
      if (st % 4 === 2) noiseHit(t, 'highpass', 7000, 0.1, 0.05);
      else if (st % 2 === 1 && Math.random() < 0.3) noiseHit(t, 'highpass', 8000, 0.04, 0.03);

      if (st === 0 || st === 3 || st === 6 || st === 8 || st === 11 || st === 14) {
        const up = (st === 6 || st === 14) ? 12 : 0;
        note('triangle', mtof(c.root + up), t, STEP * 1.5, 0.36, musicBus, { cutoff: 700, r: 0.1 });
      }
      if (st === 0) {
        c.ch.forEach(m => {
          note('sawtooth', mtof(m), t, STEP * 15, 0.035, padBus, { a: 0.4, r: 0.8, cutoff: 1100, detune: -7 });
          note('sawtooth', mtof(m), t, STEP * 15, 0.035, padBus, { a: 0.4, r: 0.8, cutoff: 1100, detune: 7 });
        });
      }
      if (st % 2 === 0 && Math.random() < 0.82) {
        const notes = c.ch.map(m => m + 12).concat([c.ch[0] + 24]);
        const m = notes[ARP[(st / 2) % 8] % notes.length];
        note('square', mtof(m), t, STEP * 1.1, 0.045, arpSend, { cutoff: 2200, r: 0.1 });

    function scheduler() {

    function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

    function setMusic(on) {

    }
    let sfxPaused = false;
    function applySfxGain() {
      if (!ctx) return;
      sfxBus.gain.setTargetAtTime((state.sfx && !sfxPaused) ? state.sfxVol : 0, ctx.currentTime, 0.05);
    }
    function setSfx(on) { state.sfx = on; applySfxGain(); }
    function setVolume(music, sfxv) {
