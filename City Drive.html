  })();

  // Browsers only allow sound after a gesture, so start on the first press or key
  // Touch screens only count touchend/click as a "gesture", so listen for all of them
  // and keep trying until the audio context is actually running.
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev =>
    window.addEventListener(ev, () => sfx.init(), true));

  [['tglMusic', 'music', 'setMusic'], ['tglSfx', 'sfx', 'setSfx']].forEach(([id, key, fn]) => {
    const el = document.getElementById(id);
    el.addEventListener('click', () => {
      const on = !sfx.state[key];
      sfx[fn](on);
      el.classList.toggle('off', !on);
      el.setAttribute('aria-pressed', String(on));
      el.blur();
    });
  });

  /* ---------------------------------------------------------------
     Vehicle physics
  --------------------------------------------------------------- */
  // a random spot on a random road, facing along it (random spawn)
  function randomRoadPoint() {
    const vertical = Math.random() < 0.5;
    const i = Math.floor(Math.random() * (N + 1));
    const t = ur(-HALF + 14, HALF - 14);
    const dir = Math.random() < 0.5 ? 1 : -1;
    if (vertical) return { x: rc(i), z: t, h: dir > 0 ? 0 : Math.PI };
    return { x: t, z: rc(i), h: dir > 0 ? Math.PI / 2 : -Math.PI / 2 };
  }

  const spawn0 = randomRoadPoint();
  const car = {
    x: spawn0.x, z: spawn0.z, h: spawn0.h, vx: 0, vz: 0,
    steer: 0, y: 0, spin: 0,
    pitch: 0, pitchV: 0, roll: 0, rollV: 0,
    braking: false, reversing: false, vf: 0, vl: 0, accelLong: 0, yawRate: 0, hb: false,
    crashPen: null
  };
  let WHEELBASE = 2.7, VMAX = 33, ENGINE = 15, BRAKE = 30, GRIP = 7.0, CAR_R = 0.95;
  let MAXLAT = 24, STEER_LOW = 0.55, STEER_HIGH = 0.11, STEER_RATE = 4.2, STAB = 6, CAR_OFF = 1.25;
  const VREV = 9;

  const carColors = { coupe: 0xe8322b, sedan: 0x2f6fe0, hatch: 0xf2c230 };
  let playerKey = 'coupe';

  // Every stat bar in the car menu (1-10) feeds straight into these numbers
  function applySpec(key) {
    const m = CAR_MODELS[key], st = m.stats;
    VMAX = 20 + st.speed * 2;
    ENGINE = 8 + st.accel * 1.2;
    BRAKE = 14 + st.brake * 3;
    STEER_LOW = 0.36 + st.handling * 0.022;   // a touch less lock: calmer, more normal turning
    STEER_HIGH = 0.05 + st.handling * 0.008;
    STEER_RATE = 2.5 + st.handling * 0.26;    // the wheel eases in instead of snapping
    GRIP = 3.2 + st.grip * 0.6;
    MAXLAT = 14 + st.grip * 1.3;
    STAB = st.stability;
    CAR_R = m.w / 2; CAR_OFF = m.len / 2 - 0.9; WHEELBASE = m.wheelZ * 2;
  }
  function disposeCar(c) { c.group.traverse(o => { if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose(); }); }
  function setPlayerCar(key) {
    if (player) { scene.remove(player.group); disposeCar(player); }
    playerKey = key; applySpec(key);
    player = makeCar({ color: carColors[key], detailed: true, model: key });
    scene.add(player.group);
    player.group.position.set(car.x, car.y, car.z);
    player.group.rotation.y = car.h;
    player.chassis.rotation.set(car.pitch, 0, car.roll);
    player.wheels.forEach(w => { w.rotation.x = car.spin; });
    player.steerPivots.forEach(pv => { pv.rotation.y = car.steer; });
  }
  setPlayerCar('coupe');
  let shake = 0;

  /* ---------------------------------------------------------------
     Traffic — other cars that drive, signal, brake and spin their wheels
  --------------------------------------------------------------- */
  const TRAFFIC_N = 10;
  const TURN_RHO = 7;          // turning radius
  const LANE = 2.6;            // right-hand traffic lane offset
  const traffic = [];
  const trafficColors = [0x8a9099, 0x3f5b7a, 0xb8b4aa, 0x7a3b3b, 0x2f3b36,
                         0xc9b27a, 0x5a6f8c, 0xe2e0da, 0x4a7a5c, 0x9c6f8a];

  function nearRc(v) {
    let best = 0, bd = 1e9;
    for (let k = 0; k <= N; k++) { const d = Math.abs(v - rc(k)); if (d < bd) { bd = d; best = k; } }
    return best;
  }

  function farFromAll(x, z, minD) {
    for (const t of traffic) {
      const dx = t.x - x, dz = t.z - z;
      if (dx * dx + dz * dz < minD * minD) return false;
    }
    return true;
  }

  function spawnTraffic(initial) {
    for (let tries = 0; tries < 14; tries++) {
      const p = randomRoadPoint();                       // random spawn spot
      if (Math.hypot(p.x - car.x, p.z - car.z) < (initial ? 35 : 70)) continue;
      if (!farFromAll(p.x, p.z, initial ? 9 : 16)) continue;
      const model = pick(MODEL_KEYS);
      const mesh = makeCar({ color: pick(trafficColors), detailed: true, model, ghost: false });
      mesh.group.position.set(p.x, 0, p.z);
      mesh.group.rotation.y = p.h;
      scene.add(mesh.group);
      traffic.push({ mesh, x: p.x, z: p.z, h: p.h, spin: ur(0, 6),
        cruise: ur(7, 12), speed: 0, lat: LANE,
        nextKey: null, wantTurn: false, turnTo: null, signal: 0,
        arc: null, braking: false, steerSmooth: 0, waitTime: 0, passOffset: 0, yielding: false });
      return;
    }
  }

  // the next intersection ahead of a car, and the distance to it
  function nextIntAhead(t) {
    const fx = Math.sin(t.h), fz = Math.cos(t.h);
    let best = null;
    if (Math.abs(fz) >= Math.abs(fx)) {                 // on a vertical road
      for (let j = 0; j <= N; j++) {
        const f = (rc(j) - t.z) * fz;
        if (f > 0.5 && (!best || f < best.f)) best = { i: nearRc(t.x), j, f };
      }
    } else {                                            // on a horizontal road
      for (let i = 0; i <= N; i++) {
        const f = (rc(i) - t.x) * fx;
        if (f > 0.5 && (!best || f < best.f)) best = { i, j: nearRc(t.z), f };
      }
    }
    return best;
  }

  function decideTurn(t, ni) {
    t.wantTurn = false; t.turnTo = null; t.signal = 0;
    // at the edge of the map the car has to turn (the hedge is right there)
    const mustTurn = (ni.j === N && Math.cos(t.h) > 0.5) || (ni.j === 0 && Math.cos(t.h) < -0.5) ||
                     (ni.i === N && Math.sin(t.h) > 0.5) || (ni.i === 0 && Math.sin(t.h) < -0.5);
    if (Math.random() < (mustTurn ? 1 : 0.45)) {
      const hL = wrapAngle(t.h + Math.PI / 2), hR = wrapAngle(t.h - Math.PI / 2);
      const room = h => {
        const fx = Math.sin(h), fz = Math.cos(h);
        if (Math.abs(fz) >= Math.abs(fx)) return fz > 0 ? HALF - t.z : t.z + HALF;
        return fx > 0 ? HALF - t.x : t.x + HALF;
      };
      const left = room(hL) >= room(hR);                // take the roomier road
      t.turnTo = left ? hL : hR;
      t.signal = left ? 1 : -1;                         // amber indicators on
      t.wantTurn = true;
    }
  }

  function startArc(t) {
    const dir = Math.sign(wrapAngle(t.turnTo - t.h)) || 1;
    const Lx = Math.cos(t.h), Lz = -Math.sin(t.h);      // driver's left
    t.arc = {
      cx: t.x + Lx * TURN_RHO * dir, cz: t.z + Lz * TURN_RHO * dir,
      r0x: -Lx * TURN_RHO * dir, r0z: -Lz * TURN_RHO * dir,
      ang: 0, total: dir * Math.PI / 2, h0: t.h
    };
    t.wantTurn = false;
  }

  // the closest thing in this car's path (player or another traffic car)
  function obstacleAhead(t, ox, oz, ovx, ovz) {
    const fx = Math.sin(t.h), fz = Math.cos(t.h);
    const rx = -Math.cos(t.h), rz = Math.sin(t.h);
    const dx = ox - t.x, dz = oz - t.z;
    const d2 = dx * dx + dz * dz;
    if (d2 > 130) return null;
    const f = dx * fx + dz * fz, l = dx * rx + dz * rz;
    if (f > -2.5 && f < 12 && Math.abs(l) < 2.4) return { f, d2 };                 // same lane ahead
    if (f > -18 && f < -2 && Math.abs(l) > 2.8 && Math.abs(l) < 8) {          // oncoming lane
      const closing = (fx * t.speed - ovx) * fx + (fz * t.speed - ovz) * fz;
      if (closing > 3 && d2 < 80) return { f, d2, oncoming: true };
    }
    return null;
  }

  // is another car already in the intersection I'm heading for?
  function intersectionOccupied(t, ni) {
    const ix = rc(ni.i), iz = rc(ni.j);
    for (const o of traffic) {
      if (o === t) continue;
      if (Math.abs(o.x - ix) < R * 0.5 && Math.abs(o.z - iz) < R * 0.5) {
        const dO = Math.hypot(o.x - ix, o.z - iz);
        const dMe = Math.hypot(t.x - ix, t.z - iz);
        if (dO < dMe - 1) return true;   // they're closer to the centre: they go first
      }
    }
    return false;
  }

  // is the adjacent lane clear for passing? (side: -1 left, +1 right)
  function laneClear(t, side) {
    const rx = -Math.cos(t.h), rz = Math.sin(t.h);
    const lx = t.x + rx * side * 5, lz = t.z + rz * side * 5;
    for (const o of traffic) {
      if (o === t) continue;
      const dx = o.x - lx, dz = o.z - lz;
      if (dx * dx + dz * dz < 30) return false;
    }
    if (!wrecked) {
      const dx = car.x - lx, dz = car.z - lz;
      if (dx * dx + dz * dz < 30) return false;
    }
    return true;
  }

  // which car (or the player) is the obstacle ahead?
  function carAhead(t, ob) {
    if (!ob) return null;
    if (!wrecked) {
      const rp = obstacleAhead(t, car.x, car.z, car.vx, car.vz);
      if (rp && Math.abs(rp.f - ob.f) < 0.5) return 'player';
    }
    for (const o of traffic) {
      if (o === t) continue;
      const r = obstacleAhead(t, o.x, o.z, Math.sin(o.h) * o.speed, Math.cos(o.h) * o.speed);
      if (r && Math.abs(r.f - ob.f) < 0.5) return o;
    }
    return null;
  }

  function updateTraffic(dt) {
    const blink = (performance.now() % 900) < 450;
    for (let i = traffic.length - 1; i >= 0; i--) {
      const t = traffic[i];
      if (Math.hypot(t.x - car.x, t.z - car.z) > 240) {   // recycle far cars near the player
        scene.remove(t.mesh.group); disposeCar(t.mesh); traffic.splice(i, 1); spawnTraffic(false);
        continue;
      }

      const fx = Math.sin(t.h), fz = Math.cos(t.h);
      const rx = -Math.cos(t.h), rz = Math.sin(t.h);

      if (t.arc) {
        // follow the turning arc through the intersection
        const a = t.arc;
        a.ang += (t.speed / TURN_RHO) * Math.sign(a.total) * dt;
        if (Math.abs(a.ang) >= Math.abs(a.total)) a.ang = a.total;
        const ca = Math.cos(a.ang), sa = Math.sin(a.ang);
        t.x = a.cx + a.r0x * ca + a.r0z * sa;
        t.z = a.cz - a.r0x * sa + a.r0z * ca;
        t.h = wrapAngle(a.h0 + a.ang);
        if (a.ang === a.total) { t.arc = null; t.turnTo = null; t.signal = 0; }
      } else {
        const ni = nextIntAhead(t);
        if (ni) {
          const key = ni.i + ',' + ni.j;
          if (t.nextKey !== key) {
            if (ni.f < 18) { t.nextKey = key; decideTurn(t, ni); }
          } else if (t.wantTurn && ni.f <= TURN_RHO - t.lat + 0.45 && ni.f > 0) {
            startArc(t);
          } else if (t.wantTurn && ni.f <= 0) {
            t.wantTurn = false; t.turnTo = null; t.signal = 0;
          }
          // yield: don't enter an intersection another car is already in
          if (ni.f > 2 && intersectionOccupied(t, ni)) t.yielding = true;
          else if (ni.f > 8) t.yielding = false;
        }
        // drive straight, and keep to the right-hand lane
        t.x += fx * t.speed * dt;
        t.z += fz * t.speed * dt;
        const ii = nearRc(t.x), ij = nearRc(t.z);
        const inBox = Math.abs(t.z - rc(ij)) < R * 0.55 && Math.abs(t.x - rc(ii)) < R * 0.55;
        if (!inBox) {
          let center, cur;
          if (Math.abs(fz) >= Math.abs(fx)) { center = rc(ii); cur = (t.x - center) * rx; }
          else { center = rc(ij); cur = (t.z - center) * rz; }
          const err = (t.lat + t.passOffset - cur) * Math.min(1, 3 * dt);
          t.x += rx * err; t.z += rz * err;
        }
      }

      // keep a safe gap behind the car (or person) ahead, like real driving
      t.braking = false;
      let ob = null;
      if (!wrecked) {
        ob = obstacleAhead(t, car.x, car.z, car.vx, car.vz);
        for (const o of traffic) {
          if (o === t) continue;
          const r = obstacleAhead(t, o.x, o.z, Math.sin(o.h) * o.speed, Math.cos(o.h) * o.speed);
          if (r && (!ob || r.f < ob.f)) ob = r;
        }
      }
      let target = t.arc ? t.cruise * 0.55 : t.cruise;
      if (ob) {
        if (ob.oncoming) {                       // someone heading at us: crawl
          target = Math.min(target, t.speed * 0.15);
          t.braking = true;
        } else {
          const gap = ob.f - 3.4;                // bumper-to-bumper room
          const desired = 2.2 + t.speed * 0.5;   // faster = bigger gap
          if (gap < desired) {
            target = Math.max(0, (gap - desired) * 1.6 + t.speed * 0.5);
            t.braking = gap < desired * 0.6;
          }
        }
      }
      // yield at intersections: wait for the other car to clear
      if (t.yielding) {
        target = 0;
        t.braking = true;
        t.waitTime += dt;
        if (t.waitTime > 5) { t.yielding = false; t.waitTime = 0; }   // don't wait forever
      }
      // pass a stopped vehicle: wait a moment, then go around it
      if (ob && !ob.oncoming && ob.d2 < 30 && !t.yielding) {
        const ahead = carAhead(t, ob);
        const stopped = ahead === 'player' ? Math.hypot(car.vx, car.vz) < 0.5
                                           : (ahead && ahead.speed < 0.5);
        if (stopped) {
          t.waitTime += dt;
          if (t.waitTime > 2) {
            if (laneClear(t, -1)) t.passOffset = -2.2;
            else if (laneClear(t, 1)) t.passOffset = 2.2;
          }
        } else {
          t.waitTime = 0;
        }
      } else if (!t.yielding) {
        if (!ob || ob.f > 14) t.passOffset = 0;
      }
      t.speed += clamp(target - t.speed, -16 * dt, 5.5 * dt);
      if (t.speed < 0.01 && t.braking) t.speed = 0;

      // gentle separation so the cars never overlap each other
      for (const o of traffic) {
        if (o === t) continue;
        const dx = o.x - t.x, dz = o.z - t.z;
        const d2 = dx * dx + dz * dz;
        if (d2 < 10.2 && d2 > 1e-6) {
          const d = Math.sqrt(d2), push = (3.2 - d) * 0.5;
          t.x -= (dx / d) * push; t.z -= (dz / d) * push;
        }
      }

      // bump into the player = a crash
      if (!wrecked) {
        const dx = car.x - t.x, dz = car.z - t.z;
        const d = Math.hypot(dx, dz), minD = CAR_R + 1.55;
        if (d < minD && d > 1e-4) {
          const nx = dx / d, nz = dz / d;
          car.x += nx * (minD - d); car.z += nz * (minD - d);
          const vn = car.vx * nx + car.vz * nz;
          if (vn < 0) {
            const j = -0.8 * vn;   // softer bounce: the visual penetration does the rest
            car.vx += nx * j; car.vz += nz * j;
            t.speed *= 0.7;
            shake = Math.max(shake, Math.min(1, j / 16));
            sfx.impact(j);
            registerCrash(j);
            // visual: the player's front sinks into the other car (superficial, centred)
            car.crashPen = { nx, nz, depth: 0.6, t: 0 };
          }
        }
      }

      // visuals: body, spinning wheels, steering, lights, blinking indicators
      const g = t.mesh.group;
      g.position.set(t.x, 0, t.z);
      g.rotation.y = t.h;
      t.spin += (t.speed / t.mesh.model.wheelR) * dt;
      t.mesh.wheels.forEach(w => { w.rotation.x = t.spin; });
      // wheels turn smoothly into the corner and ease back, like a real car
      const steerTarget = t.arc ? Math.sign(t.arc.total) * 0.42 : 0;
      t.steerSmooth += clamp(steerTarget - t.steerSmooth, -3 * dt, 3 * dt);
      t.mesh.steerPivots.forEach(p => { p.rotation.y = t.steerSmooth; });
      t.mesh.tailMat.color.setHex(t.braking ? 0xff2a2a : 0x8a1212);
      t.mesh.indMat.color.setHex(t.signal !== 0 && blink ? 0xffb020 : 0x6b4a12);
    }
  }

  for (let k = 0; k < TRAFFIC_N; k++) spawnTraffic(true);

  // send every traffic car to a new random spot (fresh layout on every restart)
  function reshuffleTraffic() {
    for (const t of traffic) { scene.remove(t.mesh.group); disposeCar(t.mesh); }
    traffic.length = 0;
    for (let k = 0; k < TRAFFIC_N; k++) spawnTraffic(true);
  }

  /* ---------------------------------------------------------------
     Fire — what the car does after the third crash
  --------------------------------------------------------------- */
  const fire = (function () {
    const FN = 110;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(FN * 3);
    const col = new Float32Array(FN * 3);
    const vel = new Float32Array(FN * 3);
    const life = new Float32Array(FN);
    const maxLife = new Float32Array(FN);
    for (let i = 0; i < FN; i++) pos[i * 3 + 1] = -50;
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const g2 = cv.getContext('2d');
    const grd = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.35, 'rgba(255,255,255,.6)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g2.fillStyle = grd; g2.fillRect(0, 0, 64, 64);
    const tex = new THREE.CanvasTexture(cv);
    const mat = new THREE.PointsMaterial({
      size: 1.9, map: tex, transparent: true, opacity: 0.95,
      depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true
    });
    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false; pts.visible = false;
    scene.add(pts);
    const light = new THREE.PointLight(0xff6a22, 0, 24, 2);
    scene.add(light);
    let on = false;
    const cHot = new THREE.Color(0xffd23e), cCold = new THREE.Color(0xff3a00), tmpC = new THREE.Color();

    function enginePos() {
      const M = player.model;
      return [car.x + Math.sin(car.h) * M.len * 0.3, car.y + 0.95, car.z + Math.cos(car.h) * M.len * 0.3];
    }
    function respawn(i, ex, ey, ez) {
      const k = i * 3;
      pos[k] = ex + (Math.random() - 0.5) * 1.2;
      pos[k + 1] = ey + Math.random() * 0.5;
      pos[k + 2] = ez + (Math.random() - 0.5) * 1.2;
      vel[k] = (Math.random() - 0.5) * 2.4;
      vel[k + 1] = 1.8 + Math.random() * 2.6;
      vel[k + 2] = (Math.random() - 0.5) * 2.4;
      maxLife[i] = 0.35 + Math.random() * 0.5;
      life[i] = maxLife[i];
    }
    function update(dt) {
      if (!on) return;
      const ep = enginePos(), ex = ep[0], ey = ep[1], ez = ep[2];
      for (let i = 0; i < FN; i++) {
        life[i] -= dt;
        const k = i * 3;
        if (life[i] <= 0) { respawn(i, ex, ey, ez); continue; }
        pos[k] += vel[k] * dt; pos[k + 1] += vel[k + 1] * dt; pos[k + 2] += vel[k + 2] * dt;
        vel[k + 1] += 2.4 * dt;
        vel[k] *= (1 - 1.2 * dt); vel[k + 2] *= (1 - 1.2 * dt);
        tmpC.copy(cCold).lerp(cHot, life[i] / maxLife[i]);
        col[k] = tmpC.r; col[k + 1] = tmpC.g; col[k + 2] = tmpC.b;
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
      light.position.set(ex, ey + 0.7, ez);
      light.intensity = 1.7 + Math.sin(performance.now() * 0.021) * 0.7 + Math.random() * 0.5;
      player.bodyMat.emissive.setHex(0xff4400);
      player.bodyMat.emissiveIntensity = 0.4 + 0.25 * Math.sin(performance.now() * 0.03) + Math.random() * 0.2;
    }
    return {
      start() {
        on = true; pts.visible = true;
        const ep = enginePos();
        for (let i = 0; i < FN; i++) { respawn(i, ep[0], ep[1], ep[2]); life[i] = Math.random() * maxLife[i]; }
        update(0.001);
      },
      stop() { on = false; pts.visible = false; light.intensity = 0; if (player) player.bodyMat.emissiveIntensity = 0; },
      update
    };
  })();

  function groundHeight(x, z) {
    const u = (x + HALF - R) / P, v = (z + HALF - R) / P;
    if (u < 0 || v < 0) return 0;
    const iu = Math.floor(u), iv = Math.floor(v);
    if (iu >= N || iv >= N) return 0;
    return ((u - iu) * P <= B && (v - iv) * P <= B) ? SW : 0;
  }

  let crashes = 0, lastCrashT = 0;
  function registerCrash(j) {
    if (j < 5.5 || wrecked) return;                 // only real crashes count
    const now = performance.now();
    if (now - lastCrashT < 800) return;             // one crash at a time
    lastCrashT = now;
    crashes = Math.min(3, crashes + 1);
    updateDamage();
    if (crashes >= 3) wreck();
  }

  function collide() {
    for (let pass = 0; pass < 2; pass++) {
      const fx = Math.sin(car.h), fz = Math.cos(car.h);
      for (const o of [CAR_OFF, 0, -CAR_OFF]) {
        let cx = car.x + fx * o, cz = car.z + fz * o;
        for (let bi = 0; bi < colliders.length; bi++) {
          const b = colliders[bi];
          if (cx < b.minX - CAR_R || cx > b.maxX + CAR_R || cz < b.minZ - CAR_R || cz > b.maxZ + CAR_R) continue;
          const qx = clamp(cx, b.minX, b.maxX), qz = clamp(cz, b.minZ, b.maxZ);
          const dx = cx - qx, dz = cz - qz, d2 = dx * dx + dz * dz;
          if (d2 >= CAR_R * CAR_R) continue;
          let nx, nz, pen;
          if (d2 > 1e-8) { const d = Math.sqrt(d2); nx = dx / d; nz = dz / d; pen = CAR_R - d; }
          else {
            const l = cx - b.minX, r = b.maxX - cx, t = cz - b.minZ, bt = b.maxZ - cz;
            const m = Math.min(l, r, t, bt);
            nx = 0; nz = 0;
            if (m === l) nx = -1; else if (m === r) nx = 1; else if (m === t) nz = -1; else nz = 1;
            pen = m + CAR_R;
          }
          car.x += nx * pen; car.z += nz * pen; cx += nx * pen; cz += nz * pen;
          const vn = car.vx * nx + car.vz * nz;
          if (vn < 0) {
            const j = -(1.3 - STAB * 0.02) * vn;
            car.vx += nx * j; car.vz += nz * j;
            const tx = -nz, tz = nx, vt = car.vx * tx + car.vz * tz;
            car.vx -= tx * vt * 0.05; car.vz -= tz * vt * 0.05;
            const rx = cx - car.x, rz = cz - car.z;
            const torque = (rz * nx - rx * nz) * j;
            car.h += clamp(torque * 0.012 * (1.5 - STAB * 0.1), -0.12, 0.12);
            shake = Math.max(shake, Math.min(1, j / 16));
            sfx.impact(j);
            registerCrash(j);
          }
        }
      }
    }
  }

  function step(dt) {
    let fx = Math.sin(car.h), fz = Math.cos(car.h);
    let rx = -Math.cos(car.h), rz = Math.sin(car.h);
    const vf0 = car.vx * fx + car.vz * fz;
    const up = held('up'), down = held('down'), hb = held('hb');
    const steerIn = (held('left') ? 1 : 0) - (held('right') ? 1 : 0);

    // steering wheel angle: smooth, speed-sensitive, eases in like a real car
    const s = Math.min(1, Math.abs(vf0) / 26);
    const maxSteer = (STEER_LOW - (STEER_LOW - STEER_HIGH) * s) * (hb ? 1.2 : 1);
    const target = steerIn * maxSteer;
    const rate = steerIn === 0 ? 5 : STEER_RATE;
    car.steer += clamp(target - car.steer, -rate * dt, rate * dt);
    if (Math.abs(car.steer) > maxSteer) car.steer = Math.sign(car.steer) * maxSteer;

    // longitudinal
    let a = 0, braking = false, reversing = false;
    if (up && !down) {
      if (vf0 < -0.6) { a = BRAKE; braking = true; }
      else a = ENGINE * Math.max(-1, 1 - Math.pow(vf0 / VMAX, 2));
    } else if (down && !up) {
      if (vf0 > 0.6) { a = -BRAKE; braking = true; }
      else { a = -ENGINE * 0.6 * Math.max(-1, 1 - Math.pow(-vf0 / VREV, 2)); reversing = true; }
    } else {
      const c = 2.6 + 0.012 * vf0 * vf0;
      a = -Math.sign(vf0) * Math.min(Math.abs(vf0) / dt, c);
    }
    if (car.y > 0.1) a -= vf0 * 0.9;   // sidewalk drag
    if (hb) a -= Math.sign(vf0) * Math.min(Math.abs(vf0) / dt, 9.5);   // handbrake locks the rears: strong braking
    let vf1 = vf0 + a * dt;
    if (braking && Math.sign(vf1) !== Math.sign(vf0)) vf1 = 0;
    car.vx += fx * (vf1 - vf0); car.vz += fz * (vf1 - vf0);
    car.accelLong += ((vf1 - vf0) / dt - car.accelLong) * Math.min(1, dt * 10);
    car.braking = braking; car.reversing = reversing;

    // yaw from bicycle model, limited by tyre grip (handbrake lets the rear rotate)
    let yaw = (vf1 / WHEELBASE) * Math.tan(car.steer);
    const maxLat = hb ? MAXLAT * 1.9 : MAXLAT;
    if (Math.abs(vf1) > 1 && Math.abs(vf1 * yaw) > maxLat) yaw = Math.sign(yaw) * maxLat / Math.abs(vf1);
    car.yawRate = yaw;
    car.h += yaw * dt;

    // re-project velocity on new heading, then apply lateral grip
    fx = Math.sin(car.h); fz = Math.cos(car.h); rx = -Math.cos(car.h); rz = Math.sin(car.h);
    let vf2 = car.vx * fx + car.vz * fz;
    let vl2 = car.vx * rx + car.vz * rz;
    let grip = GRIP;
    if (hb) grip = 0.9;   // handbrake locks the rear: the car slides and drifts
    else if (braking && Math.abs(vf2) > 8 && Math.abs(car.steer) > 0.05) grip = 3.0;   // rear steps out when braking in a turn
    vl2 *= Math.exp(-grip * dt);
    car.vx = fx * vf2 + rx * vl2; car.vz = fz * vf2 + rz * vl2;
    car.vf = vf2; car.vl = vl2;
    car.hb = hb;

    car.x += car.vx * dt; car.z += car.vz * dt;
    collide();

    // ride height (curb / sidewalk)
    car.y += (groundHeight(car.x, car.z) - car.y) * Math.min(1, dt * 14);

    // body pitch & roll spring
    const pT = clamp(-car.accelLong * 0.0035, -0.075, 0.075);
    const latAcc = vf2 * yaw - vl2 * 0.0;
    const rT = clamp(latAcc * 0.0030 * (1.4 - STAB * 0.09), -0.11, 0.11);
    car.pitchV += ((pT - car.pitch) * 70 - car.pitchV * 9) * dt; car.pitch += car.pitchV * dt;
    car.rollV += ((rT - car.roll) * 70 - car.rollV * 9) * dt; car.roll += car.rollV * dt;
    car.spin += (vf2 / 0.39) * dt;
  }

  /* ---------------------------------------------------------------
     Pause menu + car selection
  --------------------------------------------------------------- */
  let paused = false, dirty = true, view = 'menu';
  const $ = id => document.getElementById(id);
  const pauseEl = $('pause'), btnPause = $('tglPause');
  const views = { menu: $('menuView'), garage: $('garageView'), settings: $('settingsView') };

  /* ---------- damage + wrecked (3 crashes) ---------- */
  let wrecked = false;
  const wreckEl = $('wreck');
  const dmgEls = document.querySelectorAll('#dmg i');

    document.body.classList.remove('is-wrecked');

    crashes = 0; lastCrashT = 0;
    updateDamage();
    fire.stop();
    resetGame();
    setPaused(false);
    sfx.setPaused(false);
  }
  updateDamage();

  const STAT_DEFS = [['speed', 'Top speed'], ['accel', 'Acceleration'], ['handling', 'Handling'],
                     ['brake', 'Braking'], ['grip', 'Grip'], ['stability', 'Stability']];
  const COLORS = [['Red', 0xe8322b], ['Orange', 0xf28c28], ['Yellow', 0xf2c230], ['Green', 0x2e9d5b], ['Teal', 0x1fa5a5],

  STAT_DEFS.forEach(([k, label]) => {
    const row = document.createElement('div'); row.className = 'stat';
    row.innerHTML = '<span>' + label + '</span><span class="bar"><i></i></span><b></b>';

    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.title = name;
    b.style.background = '#' + hex.toString(16).padStart(6, '0');
    b.setAttribute('role', 'radio'); b.setAttribute('aria-label', name);
    b.addEventListener('click', () => pickColor(hex));
    $('swatches').appendChild(b); swatchEls.push({ el: b, hex });
  });

  function renderGarage() {
    const m = CAR_MODELS[playerKey];
    $('carName').textContent = m.name;
    $('carDesc').textContent = m.desc;
    $('carDots').innerHTML = MODEL_KEYS.map(k => '<i class="' + (k === playerKey ? 'on' : '') + '"></i>').join('');
    STAT_DEFS.forEach(([k]) => { fills[k].style.width = (m.stats[k] * 10) + '%'; vals[k].textContent = m.stats[k]; });
    swatchEls.forEach(({ el, hex }) => {
      const sel = hex === carColors[playerKey];
      el.classList.toggle('sel', sel); el.setAttribute('aria-checked', String(sel));
    });
  }
  function pickColor(hex) {
    carColors[playerKey] = hex;
    player.setColor(hex);
    if (pv && pv.car) pv.car.setColor(hex);
    dirty = true; renderGarage();
  }
  function cycleCar(d) {
    const i = (MODEL_KEYS.indexOf(playerKey) + d + MODEL_KEYS.length) % MODEL_KEYS.length;
    setPlayerCar(MODEL_KEYS[i]);
    refreshPreviewCar(); renderGarage(); dirty = true;
  }

  /* second, small renderer that shows the car on a turntable */
  let pv = null;
  function initPreview() {
    if (pv) return;
    const r = new THREE.WebGLRenderer({ canvas: $('preview'), antialias: true, alpha: true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.95));
    const dl = new THREE.DirectionalLight(0xffffff, 0.85); dl.position.set(-4, 8, 5); sc.add(dl);
    const plat = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.7, 0.16, 48), new THREE.MeshLambertMaterial({ color: 0x2a3a4d }));
    plat.position.y = -0.09; sc.add(plat);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.04, 8, 64).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffb000 }));
    ring.position.y = 0; sc.add(ring);
    const cam = new THREE.PerspectiveCamera(30, 2, 0.1, 60);
    cam.position.set(0, 3.5, 9.6); cam.lookAt(0, 0.7, 0);
    const pivot = new THREE.Group(); sc.add(pivot);
    pv = { r, sc, cam, pivot, car: null };
  }
  function sizePreview() {
    const c = $('preview'), w = c.clientWidth, h = c.clientHeight;
    if (!pv || !w || !h) return;
    pv.r.setSize(w, h, false); pv.cam.aspect = w / h; pv.cam.updateProjectionMatrix();
  }
  function refreshPreviewCar() {
    if (!pv) return;
    if (pv.car) { pv.pivot.remove(pv.car.group); disposeCar(pv.car); }
    pv.car = makeCar({ color: carColors[playerKey], detailed: true, model: playerKey, ghost: false });
    pv.pivot.add(pv.car.group);
  }
  function previewTick(dt) {
    pv.pivot.rotation.y += dt * 0.7;
    pv.r.render(pv.sc, pv.cam);
  }

  function showView(v) {
    view = v;
    for (const k in views) views[k].classList.toggle('show', k === v);
    if (v === 'garage') { initPreview(); sizePreview(); refreshPreviewCar(); renderGarage(); }
    const f = $(v === 'garage' ? 'btnBack' : v === 'settings' ? 'btnSetBack' : 'btnContinue');
    if (f) f.focus({ preventScroll: true });
  }

  function setPaused(on) {
    if (on === paused) return;
    paused = on; dirty = true;
    document.body.classList.toggle('is-paused', on);
    pauseEl.classList.toggle('open', on);
    btnPause.classList.toggle('on', on);
    btnPause.setAttribute('aria-pressed', String(on));
    for (const k in keysKB) keysKB[k] = false;
    for (const k in keysPtr) keysPtr[k] = false;
    sfx.setPaused(on);          // engine, tyres and crashes go quiet; background music keeps playing
    if (on) showView('menu');
  }

  function resetGame() {
    const sp = randomRoadPoint();                 // random spawn every time
    Object.assign(car, { x: sp.x, z: sp.z, h: sp.h, vx: 0, vz: 0, steer: 0, y: 0, spin: 0,
      pitch: 0, pitchV: 0, roll: 0, rollV: 0, accelLong: 0, vf: 0, vl: 0, yawRate: 0,
      braking: false, reversing: false, hb: false, crashPen: null });
    shake = 0;
    reshuffleTraffic();        // the moving cars get new random spots
    reshuffleParked();         // the parked cars get new random curb spots
    const z = new THREE.Object3D(); z.scale.setScalar(0); z.updateMatrix();
    for (let i = 0; i < MAX_MARKS; i++) marks.setMatrixAt(i, z.matrix);
    marks.instanceMatrix.needsUpdate = true;
    markIdx = 0; lastMarkX = 1e9; lastMarkZ = 1e9;
    wheelTrail = [null, null];
    camTarget.set(car.x, 0, car.z);
    player.group.position.set(car.x, 0, car.z);
    player.group.rotation.y = car.h;
    player.chassis.rotation.set(0, 0, 0);
  }

  btnPause.addEventListener('click', () => { setPaused(!paused); btnPause.blur(); });
  $('btnContinue').addEventListener('click', () => setPaused(false));
  $('btnSettings').addEventListener('click', () => showView('settings'));
  $('btnSetBack').addEventListener('click', () => showView('menu'));
  $('btnGarage').addEventListener('click', () => showView('garage'));
  $('btnBack').addEventListener('click', () => showView('menu'));
  $('btnRefresh').addEventListener('click', () => { resetGame(); setPaused(false); });
  $('btnRestart').addEventListener('click', () => { recover(); $('btnRestart').blur(); });
  $('carPrev').addEventListener('click', () => cycleCar(-1));
  $('carNext').addEventListener('click', () => cycleCar(1));

  // settings: volumes + toggles, all saved
  const volMusic = $('volMusic'), volSfx = $('volSfx');
  volMusic.value = settings.music; volSfx.value = settings.sfx;
  $('volMusicV').textContent = settings.music; $('volSfxV').textContent = settings.sfx;
  volMusic.addEventListener('input', () => {
    settings.music = +volMusic.value; $('volMusicV').textContent = volMusic.value;
    sfx.setVolume(settings.music / 100, settings.sfx / 100); saveSettings();
  });
  volSfx.addEventListener('input', () => {
    settings.sfx = +volSfx.value; $('volSfxV').textContent = volSfx.value;
    sfx.setVolume(settings.music / 100, settings.sfx / 100); saveSettings();
  });
  function bindPill(id, key, apply) {
    const el = $(id);
    const sync = () => { el.classList.toggle('on', settings[key]); el.setAttribute('aria-checked', String(settings[key])); };
    el.addEventListener('click', () => { settings[key] = !settings[key]; sync(); apply(); saveSettings(); el.blur(); });
    sync();
  }
  bindPill('pillShadows', 'shadows', () => { sun.castShadow = settings.shadows; });
  bindPill('pillMarks', 'marks', () => { marks.visible = settings.marks; });
  bindPill('pillShake', 'shake', () => {});

  window.addEventListener('keydown', e => {
    if (wrecked && (e.code === 'KeyR' || e.code === 'Enter') && !e.repeat) {
      e.preventDefault(); recover();
    } else if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat && !wrecked) {
      e.preventDefault();
      if (paused && (view === 'garage' || view === 'settings') && e.code === 'Escape') showView('menu');
      else setPaused(!paused);
    } else if (paused && view === 'garage') {
      if (e.code === 'ArrowLeft') { e.preventDefault(); cycleCar(-1); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); cycleCar(1); }
    }
  });
  window.addEventListener('resize', () => { dirty = true; if (pv && view === 'garage') sizePreview(); });

  /* ---------------------------------------------------------------
     Visual update
  --------------------------------------------------------------- */
  const camTarget = new THREE.Vector3(car.x, 0, car.z);
  const spdEl = document.getElementById('spd');
  let hudTimer = 0;

  function updateVisuals(dt) {
    const g = player.group;
    // visual penetration: on a crash the car's front sinks into the other car
    let px = car.x, pz = car.z, penTilt = 0;
    if (car.crashPen) {
      car.crashPen.t += dt;
      const f = Math.max(0, 1 - car.crashPen.t / 0.7);
      if (f <= 0) car.crashPen = null;
      else {
        px -= car.crashPen.nx * car.crashPen.depth * f;
        pz -= car.crashPen.nz * car.crashPen.depth * f;
        penTilt = 0.12 * f;   // slight nose-down crumple
      }
    }
    g.position.set(px, car.y, pz);
    g.rotation.y = car.h;
    player.chassis.rotation.x = car.pitch + penTilt;
    player.chassis.rotation.z = car.roll;
    player.wheels.forEach(w => { w.rotation.x = car.spin; });
    player.steerPivots.forEach(p => { p.rotation.y = car.steer; });
    player.tailMat.color.setHex((car.braking || (held('down') && car.vf > 0.6)) ? 0xff2a2a : (car.reversing ? 0xf2f2f2 : 0x8a1212));

    // skid marks — one joined ribbon per rear wheel, not separate dashes
    const slipping = Math.abs(car.vl) > 1.0 || (car.braking && Math.abs(car.vf) > 9);
    if (slipping && car.y < 0.1) {
      const dx = car.x - lastMarkX, dz = car.z - lastMarkZ;
      if (dx * dx + dz * dz > 0.04) {
        const fx = Math.sin(car.h), fz = Math.cos(car.h), rx = -Math.cos(car.h), rz = Math.sin(car.h);
        const cm = CAR_MODELS[playerKey], wx = cm.wheelX;
        [-wx, wx].forEach((side, k) => {
          const nx = car.x - fx * cm.wheelZ + rx * side;
          const nz = car.z - fz * cm.wheelZ + rz * side;
          const p = wheelTrail[k];
          if (p && Math.hypot(nx - p.x, nz - p.z) < 3) dropMark(p.x, p.z, nx, nz);
          wheelTrail[k] = { x: nx, z: nz };
        });
        lastMarkX = car.x; lastMarkZ = car.z;
      }
    } else {
      wheelTrail[0] = wheelTrail[1] = null;
    }

    // camera: aerial, smoothly follows with a lead in the direction of travel
    const speed = Math.hypot(car.vx, car.vz);
    const sf = clamp(speed / VMAX, 0, 1);
    const lead = 0.32;
    const k = 1 - Math.exp(-5 * dt);
    camTarget.x += (car.x + car.vx * lead - camTarget.x) * k;
    camTarget.z += (car.z + car.vz * lead - camTarget.z) * k;
    const camH = 44 + sf * 16, camD = camH * 0.56;
    shake *= Math.exp(-6 * dt);
    let sx = 0, sz = 0;
    if (settings.shake) { sx = (Math.random() - 0.5) * shake * 1.4; sz = (Math.random() - 0.5) * shake * 1.4; }
    camera.position.set(camTarget.x + sx, camH, camTarget.z + camD + sz);
    camera.lookAt(camTarget.x, 0, camTarget.z);

    // sun follows the car, snapped to whole shadow texels so the
    // shadows stay glued to the ground and never pop or shimmer
    sun.position.set(car.x + SUN_OFFSET.x, SUN_OFFSET.y, car.z + SUN_OFFSET.z);
    sun.target.position.set(car.x, 0, car.z);
    const texel = (sc.right - sc.left) / sun.shadow.mapSize.x;
    _lightView.lookAt(sun.position, sun.target.position, _upVec);
    const e = _lightView.elements;
    _snapP.copy(sun.target.position).sub(sun.position);
    const lx = e[0] * _snapP.x + e[1] * _snapP.y + e[2] * _snapP.z;
    const ly = e[4] * _snapP.x + e[5] * _snapP.y + e[6] * _snapP.z;
    const lz = e[8] * _snapP.x + e[9] * _snapP.y + e[10] * _snapP.z;
    const slx = Math.round(lx / texel) * texel;
    const sly = Math.round(ly / texel) * texel;
    _snapP.set(e[0] * slx + e[4] * sly + e[8] * lz,
               e[1] * slx + e[5] * sly + e[9] * lz,
               e[2] * slx + e[6] * sly + e[10] * lz).add(sun.position);
    sun.target.position.copy(_snapP);
    sun.position.copy(_snapP).add(SUN_OFFSET);
    sun.target.updateMatrixWorld();

    // engine + tyre audio
    let slipAmt = car.y < 0.1 ? clamp((Math.abs(car.vl) - 2) / 5, 0, 1) : 0;
    if (car.braking && Math.abs(car.vf) > 9 && car.y < 0.1) slipAmt = Math.max(slipAmt, 0.6);
    if (car.hb && Math.abs(car.vf) > 4 && car.y < 0.1) slipAmt = Math.max(slipAmt, 0.85);
    sfx.update(speed, (held('up') || held('down')) ? 1 : 0, slipAmt, car.hb);

    // HUD + pressed states
    hudTimer += dt;
    if (hudTimer > 0.06) { hudTimer = 0; spdEl.textContent = Math.round(speed * 3.6); }
    for (const kk in keyEls) keyEls[kk].classList.toggle('pressed', held(kk));

    updateFov(sf);
  }

  function updateFov(sf) {
    const aspect = window.innerWidth / window.innerHeight;
    let vfov = 46 + sf * 6;
    const minHalfH = Math.tan(THREE.MathUtils.degToRad(46 / 2)) * 1.15;
    if (aspect < 1.15) {
      const half = Math.atan(minHalfH / aspect);
      vfov = THREE.MathUtils.radToDeg(half * 2) + sf * 6;
    }
    if (Math.abs(camera.fov - vfov) > 0.01) { camera.fov = vfov; camera.updateProjectionMatrix(); }
  }

  function onResize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();

  /* ---------------------------------------------------------------
     Main loop
  --------------------------------------------------------------- */
  let last = performance.now();
  camTarget.set(car.x, 0, car.z);
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;
    if (paused) {
      // world is frozen: draw it once (and again if something changed), plus the car preview if open
      if (dirty) { renderer.render(scene, camera); dirty = false; }
      if (view === 'garage' && pv) previewTick(dt);
      return;
    }
    if (wrecked) {
      // the car is on fire: keep the flames going until you restart
      fire.update(dt);
      renderer.render(scene, camera);
      return;
    }
    const n = Math.ceil(dt / (1 / 90));
    for (let i = 0; i < n; i++) step(dt / n);
    updateTraffic(dt);
    updateVisuals(dt);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
