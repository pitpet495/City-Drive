<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>City Drive</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #bcd5e8;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Bahnschrift", "DIN Alternate", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  }
  canvas { position: fixed; inset: 0; display: block; z-index: 0; touch-action: none; }
  button { font-family: inherit; }

  #hud {
    position: fixed; z-index: 2;
    left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top));
    display: flex; align-items: baseline; gap: 6px;
    padding: 8px 16px 9px; border-radius: 14px;
    background: rgba(14, 26, 40, .62); color: #fff;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #spd { font-size: 34px; line-height: 1; font-weight: 700; color: #ffb000; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
  #hud .u { font-size: 14px; opacity: .8; letter-spacing: .04em; }

  #hint {
    position: fixed; z-index: 2; left: 50%; top: max(18px, env(safe-area-inset-top));
    transform: translateX(-50%); padding: 8px 14px; border-radius: 12px;
    background: rgba(14, 26, 40, .62); color: #fff; font-size: 15px; white-space: nowrap;
    pointer-events: none; transition: opacity .8s ease;
  }
  #hint.gone { opacity: 0; }
  @media (max-width: 560px) { #hint { top: auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 190px); } }

  .tgl.on { background: #ffb000; color: #14202c; border-color: #ffd36b; }
  body.is-paused .pad { opacity: 0; pointer-events: none; }
  .pad { transition: opacity .2s ease; }

  /* ---------- pause overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 6; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    padding: 72px 14px 14px;
    background: rgba(10, 20, 32, .5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    visibility: hidden; opacity: 0; transition: opacity .2s ease, visibility .2s;
  }
  .overlay.open { visibility: visible; opacity: 1; }
  .panel {
    width: min(100%, 420px); max-height: 100%; overflow-y: auto; box-sizing: border-box;
    border-radius: 26px; padding: 18px; color: #fff;
    background: rgba(14, 26, 40, .84); border: 1.5px solid rgba(255, 255, 255, .16);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    transform: translateY(10px) scale(.98); transition: transform .22s ease;
    touch-action: pan-y; overscroll-behavior: contain;
  }
  .overlay.open .panel { transform: none; }
  .view { display: none; }
  .view.show { display: block; }
  .panel h2 { margin: 2px 0 12px; font-size: 24px; letter-spacing: .05em; text-transform: uppercase; }

  .mbtn {
    width: 100%; min-height: 58px; margin-top: 10px; padding: 0 18px; box-sizing: border-box;
    display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer;
    font-size: 18px; color: #fff; border-radius: 16px;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2);
    outline: none; transition: background .12s ease, transform .08s ease;
  }
  .mbtn svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .mbtn:hover { background: rgba(255, 255, 255, .15); }
  .mbtn:active { transform: scale(.98); }
  .mbtn:focus-visible { box-shadow: 0 0 0 3px #fff; }
  .mbtn.primary { background: #ffb000; border-color: #ffd36b; color: #14202c; font-weight: 700; }
  .mbtn.primary:hover { background: #ffc233; }
  .mbtn:disabled { opacity: .4; cursor: not-allowed; }
  .mbtn:disabled:hover { background: rgba(255, 255, 255, .08); }
  .mbtn em { margin-left: auto; font-style: normal; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }

  .ghead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ghead h2 { margin: 0; }
  .back, .nav {
    width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer; flex: none;
    border: 1.5px solid rgba(255, 255, 255, .35); background: rgba(14, 26, 40, .6); color: #fff;
    display: grid; place-items: center; outline: none;
  }
  .back svg, .nav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .back:active, .nav:active { background: #ffb000; color: #14202c; }
  .back:focus-visible, .nav:focus-visible { box-shadow: 0 0 0 3px #fff; }
  .stage {
    position: relative; border-radius: 18px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 75%, #3d587a 0%, #1b2b3d 72%);
  }
  #preview { position: relative; inset: auto; z-index: auto; display: block; width: 100%; height: clamp(150px, 26vh, 230px); touch-action: pan-y; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); }
  .nav.prev { left: 8px; }
  .nav.next { right: 8px; }
  .cname { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .cname strong { font-size: 20px; }
  #carDots { display: flex; gap: 6px; }
  #carDots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .25); }
  #carDots i.on { background: #ffb000; }
  #carDesc { margin: 4px 0 12px; font-size: 14px; line-height: 1.35; color: rgba(255, 255, 255, .78); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .sw { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); cursor: pointer; outline: none; }
  .sw.sel { box-shadow: 0 0 0 2px #14202c, 0 0 0 4px #ffb000; }
  .sw:focus-visible { box-shadow: 0 0 0 3px #fff; }
  .stat { display: grid; grid-template-columns: 96px 1fr 22px; align-items: center; gap: 10px; margin: 7px 0; font-size: 14px; }
  .bar { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #ffb000, #ffd36b); transition: width .35s ease; }
  .stat b { text-align: right; font-variant-numeric: tabular-nums; }

  .toggles {
    position: fixed; z-index: 8; display: flex; gap: 10px;
    right: max(14px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top));
  }
  .tgl {
    width: 46px; height: 46px; padding: 0; border-radius: 14px; cursor: pointer;
    background: rgba(14, 26, 40, .62); color: #ffb000;
    border: 1.5px solid rgba(255, 255, 255, .3);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center; outline: none; touch-action: manipulation;
  }
  .tgl svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tgl .slash { display: none; }
  .tgl.off { color: rgba(255, 255, 255, .6); }
  .tgl.off .slash { display: block; }
  .tgl:focus-visible { box-shadow: 0 0 0 3px #fff; }

  .pad {
    position: fixed; z-index: 3; display: flex; gap: 14px;
    bottom: max(18px, env(safe-area-inset-bottom));
    --k: clamp(66px, 17vmin, 96px);
  }
  .padL { left: max(18px, env(safe-area-inset-left)); flex-direction: row; }
  .padR { right: max(18px, env(safe-area-inset-right)); flex-direction: column; }

  .key {
    width: var(--k); height: var(--k); padding: 0; border-radius: 22px; cursor: pointer;
    background: rgba(14, 26, 40, .58); color: #fff;
    border: 1.5px solid rgba(255, 255, 255, .38);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center; outline: none;
    touch-action: none; transition: transform .08s ease, background .08s ease, color .08s ease;
  }
  .key svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .key.pressed { background: #ffb000; color: #14202c; border-color: #ffd36b; transform: scale(.94); }
  .key:focus-visible { box-shadow: 0 0 0 3px #fff; }

  /* ---------- settings rows ---------- */
  .srow { display: flex; align-items: center; gap: 12px; margin: 13px 0; font-size: 15px; }
  .srow > label { flex: none; width: 112px; color: rgba(255, 255, 255, .85); }
  .srow output { flex: none; width: 34px; text-align: right; font-variant-numeric: tabular-nums; opacity: .8; font-size: 13px; }
  input[type="range"] { flex: 1; appearance: none; -webkit-appearance: none; height: 8px; border-radius: 4px;
    background: rgba(255, 255, 255, .14); outline: none; cursor: pointer; margin: 0; }
  input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #ffb000; border: 2px solid #14202c; box-shadow: 0 0 0 2px #ffd36b; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #ffb000; border: 2px solid #14202c; cursor: pointer; }
  input[type="range"]:focus-visible { box-shadow: 0 0 0 3px #fff; }
  .pill { margin-left: auto; flex: none; width: 52px; height: 28px; border-radius: 14px; cursor: pointer;
    border: 1.5px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); position: relative;
    transition: background .15s ease; outline: none; padding: 0; }
  .pill::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: transform .15s ease; }
  .pill.on { background: #ffb000; border-color: #ffd36b; }
  .pill.on::after { transform: translateX(24px); }
  .pill:focus-visible { box-shadow: 0 0 0 3px #fff; }

  /* ---------- damage dots ---------- */
  #dmg { display: inline-flex; gap: 5px; align-items: center; padding-left: 12px; margin-left: 4px;
    border-left: 1px solid rgba(255, 255, 255, .25); }
  #dmg i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .22);
    transition: background .25s ease, box-shadow .25s ease, transform .25s ease; }
  #dmg i.hit { background: #ff5a3c; box-shadow: 0 0 9px rgba(255, 90, 60, .85); transform: scale(1.15); }

  body.is-wrecked .toggles, body.is-wrecked .pad { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="hud"><span id="spd">0</span><span class="u">km/h</span><span id="dmg" title="Damage"><i></i><i></i><i></i></span></div>
<div id="hint">Hold ▲ to drive · Space = handbrake · Arrow keys work too.</div>

<div class="overlay" id="pause" role="dialog" aria-modal="true" aria-label="Pause menu">
  <div class="panel">
    <section class="view show" id="menuView">
      <h2>Paused</h2>
      <button class="mbtn primary" id="btnContinue" type="button">
        <svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg><span>Continue</span>
      </button>
      <button class="mbtn" id="btnSettings" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span>
      </button>
      <button class="mbtn" id="btnGarage" type="button">
        <svg viewBox="0 0 24 24"><path d="M5 15l1.6-4.6A2 2 0 018.5 9h7a2 2 0 011.9 1.4L19 15"/><path d="M4 15h16v3.5H4z"/><path d="M7 18.5V20M17 18.5V20"/></svg><span>Car selection</span>
      </button>
      <button class="mbtn" id="btnRefresh" type="button">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.4-5.7"/><path d="M20 4v5h-5"/></svg><span>Refresh</span>
      </button>
    </section>

    <section class="view" id="garageView">
      <div class="ghead">
        <button class="back" id="btnBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7"/></svg></button>
        <h2>Car selection</h2>
      </div>
      <div class="stage">
        <canvas id="preview"></canvas>
        <button class="nav prev" id="carPrev" type="button" aria-label="Previous car"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7"/></svg></button>
        <button class="nav next" id="carNext" type="button" aria-label="Next car"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7"/></svg></button>
      </div>
      <div class="cname"><strong id="carName"></strong><span id="carDots"></span></div>
      <p id="carDesc"></p>
      <div class="swatches" id="swatches" role="radiogroup" aria-label="Car colour"></div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="view" id="settingsView">
      <div class="ghead">
        <button class="back" id="btnSetBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7"/></svg></button>
        <h2>Settings</h2>
      </div>
      <div class="srow"><label for="volMusic">Music</label><input type="range" id="volMusic" min="0" max="100" step="1" value="100"><output id="volMusicV">100</output></div>
      <div class="srow"><label for="volSfx">Sound effects</label><input type="range" id="volSfx" min="0" max="100" step="1" value="100"><output id="volSfxV">100</output></div>
      <div class="srow"><label>Shadows</label><button class="pill on" id="pillShadows" type="button" role="switch" aria-checked="true" aria-label="Shadows"></button></div>
      <div class="srow"><label>Skid marks</label><button class="pill on" id="pillMarks" type="button" role="switch" aria-checked="true" aria-label="Skid marks"></button></div>
      <div class="srow"><label>Camera shake</label><button class="pill on" id="pillShake" type="button" role="switch" aria-checked="true" aria-label="Camera shake"></button></div>
    </section>
  </div>
</div>

<div class="overlay" id="wreck" role="dialog" aria-modal="true" aria-label="Wrecked">
  <div class="panel">
    <h2 style="color:#ff5a3c">Wrecked!</h2>
    <p style="margin:0 0 4px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.8)">You crashed 3 times and the car is on fire.</p>
    <button class="mbtn primary" id="btnRestart" type="button">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.4-5.7"/><path d="M20 4v5h-5"/></svg><span>Restart</span>
    </button>
  </div>
</div>

<div class="toggles">
  <button class="tgl" id="tglPause" type="button" aria-pressed="false" aria-label="Pause menu" title="Pause (Esc)">
    <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke-width="2.8"/></svg>
  </button>
  <button class="tgl" id="tglMusic" type="button" aria-pressed="true" aria-label="Music" title="Music">
    <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="16" r="2.2"/><path class="slash" d="M4 4l16 16"/></svg>
  </button>
  <button class="tgl" id="tglSfx" type="button" aria-pressed="true" aria-label="Sound effects" title="Sound effects">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.5a8 8 0 010 11"/><path class="slash" d="M4 4l16 16"/></svg>
  </button>
</div>

<div class="pad padL">
  <button class="key" data-k="left" type="button" aria-label="Steer left"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7"/></svg></button>
  <button class="key" data-k="hb" type="button" aria-label="Handbrake" title="Handbrake (Space)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M10 17V7h3.4a2.7 2.7 0 010 5.4H10"/></svg></button>
  <button class="key" data-k="right" type="button" aria-label="Steer right"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7"/></svg></button>
</div>
<div class="pad padR">
  <button class="key" data-k="up" type="button" aria-label="Accelerate"><svg viewBox="0 0 24 24"><path d="M5 15l7-8 7 8"/></svg></button>
  <button class="key" data-k="down" type="button" aria-label="Brake and reverse"><svg viewBox="0 0 24 24"><path d="M5 9l7 8 7-8"/></svg></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     Helpers
  --------------------------------------------------------------- */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rng = (function (a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  })(20240611);
  const rr = (a, b) => a + (b - a) * rng();
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const ur = (a, b) => a + (b - a) * Math.random();
  const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));

  const settings = (() => {
    const def = { music: 100, sfx: 100, shadows: true, marks: true, shake: true };
    try { return Object.assign(def, JSON.parse(localStorage.getItem('citydrive.settings') || '{}')); }
    catch (_) { return def; }
  })();
  function saveSettings() { try { localStorage.setItem('citydrive.settings', JSON.stringify(settings)); } catch (_) {} }

  /* ---------------------------------------------------------------
     Renderer / scene / camera
  --------------------------------------------------------------- */
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const SKY = 0xbcd5e8;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 170, 430);

  const camera = new THREE.PerspectiveCamera(46, 1, 4, 700);

  const hemi = new THREE.HemisphereLight(0xdfeaff, 0x8a9a6a, 0.62);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d2, 0.9);
  sun.castShadow = settings.shadows;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera;
  sc.left = -95; sc.right = 95; sc.top = 95; sc.bottom = -95; sc.near = 1; sc.far = 400;
  sun.shadow.bias = -0.0006;
  scene.add(sun); scene.add(sun.target);
  const SUN_OFFSET = new THREE.Vector3(-70, 120, 55);
  const _lightView = new THREE.Matrix4();
  const _lightInv = new THREE.Matrix4();
  const _snapP = new THREE.Vector3();
  const _upVec = new THREE.Vector3(0, 1, 0);

  /* ---------------------------------------------------------------
     City layout constants
  --------------------------------------------------------------- */
  const N = 4;
  const B = 40;
  const R = 14;
  const P = B + R;
  const HALF = (N * P + R) / 2;
  const SW = 0.4;
  const rc = i => -HALF + R / 2 + i * P;
  const bc = i => -HALF + R + B / 2 + i * P;

  const colliders = [];
  const bodies = [], signs = [], fallingSigns = [];
  const matCache = {};
  function lam(c) { return matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c })); }
  function box(w, h, d, x, y, z, color, cast, recv) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lam(color));
    m.position.set(x, y, z);
    m.castShadow = cast !== false;
    m.receiveShadow = recv !== false;
    scene.add(m);
    return m;
  }
  function addCollider(cx, cz, w, d) {
    const col = { minX: cx - w / 2, maxX: cx + w / 2, minZ: cz - d / 2, maxZ: cz + d / 2 };
    colliders.push(col);
    return col;
  }

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600).rotateX(-Math.PI / 2), lam(0x9dbb86));
  ground.position.y = -0.06; ground.receiveShadow = true; scene.add(ground);

  const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, HALF * 2).rotateX(-Math.PI / 2), lam(0x3d4551));
  asphalt.position.y = 0.01; asphalt.receiveShadow = true; scene.add(asphalt);

  (function markings() {
    const dummy = new THREE.Object3D();
    const dashGeo = new THREE.PlaneGeometry(0.3, 3).rotateX(-Math.PI / 2);
    const zebraGeo = new THREE.PlaneGeometry(0.7, 2.6).rotateX(-Math.PI / 2);
    const dashMat = new THREE.MeshLambertMaterial({ color: 0xe9c94e });
    const zebraMat = new THREE.MeshLambertMaterial({ color: 0xe9e7df });

    const dashes = [], zebras = [];
    const nearIntersection = v => { for (let k = 0; k <= N; k++) if (Math.abs(v - rc(k)) < R / 2 + 2.5) return true; return false; };

    for (let i = 0; i <= N; i++) {
      for (let t = -HALF + 1.5; t < HALF; t += 6) {
        if (nearIntersection(t)) continue;
        dashes.push([rc(i), t, 0]);
        dashes.push([t, rc(i), Math.PI / 2]);
      }
    }
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
      const ix = rc(i), iz = rc(j), off = R / 2 + 2.2;
      const sides = [[0, -1, j > 0], [0, 1, j < N], [-1, 0, i > 0], [1, 0, i < N]];
      for (const [sx, sz, ok] of sides) {
        if (!ok) continue;
        for (let s = -5.6; s <= 5.61; s += 1.4) {
          if (sx === 0) zebras.push([ix + s, iz + sz * off, 0]);
          else zebras.push([ix + sx * off, iz + s, Math.PI / 2]);
        }
      }
    }
    function inst(geo, mat, list, y) {
      const m = new THREE.InstancedMesh(geo, mat, list.length);
      list.forEach((d, k) => {
        dummy.position.set(d[0], y, d[1]); dummy.rotation.set(0, d[2], 0); dummy.updateMatrix();

  function building(cx, cz, w, d, h, tint, trim) {
    const geo = new THREE.BoxGeometry(w, h, d);

  function buildBlock(cx, cz) {
    const dist = Math.hypot(cx, cz);
    const downtown = dist < 50;
    const tall = Math.max(0, 1 - dist / 125);

    if (!downtown && rng() < 0.16) {
      const w = B - 6 - rr(0, 2), d = B - 6 - rr(0, 2);

    const lot = (B - 6 - 2) / 2;
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) {

    }

  const parkedGroup = new THREE.Group();

  // Parked cars are real rigid bodies: mass, spin, sliding friction, and they shove each other.
  function addParked(model, color, x, z, h) {

    c.group.position.set(x, 0, z); c.group.rotation.y = h;
    parkedGroup.add(c.group);

      car: c, group: c.group, key: model, x, z, h, y: 0, vx: 0, vz: 0, w: 0, sleep: true,
      m: m.mass, invM: 1 / m.mass, invI: 12 / (m.mass * (m.len * m.len + m.w * m.w)),

  function parkedCars(cx, cz) {

      if (R() > 0.26) continue;
      const along = R() < 0.5 ? 0 : Math.PI;
      const off = B / 2 + 1.35;
      const model = MODEL_KEYS[Math.floor(R() * MODEL_KEYS.length)];
      const color = PARKED_COLORS[Math.floor(R() * PARKED_COLORS.length)];
      if (R() < 0.5) addParked(model, color, cx + side * off, cz + t, along);
      else addParked(model, color, cx + t, cz + side * off, along + Math.PI / 2);

  }

    bodies.length = 0;

  }

  (function walls() {

      [0, -HALF - T / 2, L, T], [0, HALF + T / 2, L, T],
      [-HALF - T / 2, 0, T, HALF * 2], [HALF + T / 2, 0, T, HALF * 2]
    ];

  /* ---------------------------------------------------------------
     Traffic lights: one signal head per approach, on the right-hand side
     just before the junction. Traffic obeys exactly these two states.
  --------------------------------------------------------------- */
  const LIGHT_GREEN = 6, LIGHT_YELLOW = 1.5, LIGHT_RED = 0.5;
  let lightClock = 0;
  let xState = 'red', zState = 'green';     // what drivers travelling along X / along Z see
  const lampMats = { x: {}, z: {} }, glowMats = { x: {}, z: {} };
  const STOP_F = 13.3;                      // stop line: distance from the junction centre to the car's centre
  const LIGHT_COLORS = { red: [0xff0000, 0x330000], yellow: [0xffaa00, 0x332200], green: [0x00ff00, 0x003300] };

  function signalFor(h) { return Math.abs(Math.sin(h)) > Math.abs(Math.cos(h)) ? xState : zState; }

  function createTrafficLights() {
    const spots = [];
    const o = R / 2 + 1.2, a = R / 2 + 1.5;
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
      const ix = rc(i), iz = rc(j);
      const defs = [
        { axis: 'z', hx: 0, hz: 1, x: ix - o, z: iz - a },     // travelling +z
        { axis: 'z', hx: 0, hz: -1, x: ix + o, z: iz + a },    // travelling -z
        { axis: 'x', hx: 1, hz: 0, x: ix - a, z: iz + o },     // travelling +x
        { axis: 'x', hx: -1, hz: 0, x: ix + a, z: iz - o }     // travelling -x
      ];
      for (const s of defs) {
        if (groundHeight(s.x, s.z) === 0) {      // no pavement on the right (edge of town): use the far side
          if (s.axis === 'z') s.x = 2 * ix - s.x; else s.z = 2 * iz - s.z;
          if (groundHeight(s.x, s.z) === 0) continue;
        }
        spots.push(s);
      }
    }

          if (o <= 0) { colliding = false; break; }
          if (o < minO) { minO = o; minAx = [ax, az]; }
        }
        if (colliding) {
          const [ax, az] = minAx;
          const side = (dx * ax + dz * az) >= 0 ? 1 : -1;
          const nx = ax * side, nz = az * side;
          car.x += nx * minO; car.z += nz * minO;
          const vn = car.vx * nx + car.vz * nz;
          if (vn < 0) {
            const j = -0.8 * vn;
            car.vx += nx * j; car.vz += nz * j;
            t.speed *= 0.7;
            shake = Math.max(shake, Math.min(1, j / 16));
            sfx.impact(j);
            registerCrash(j);
          }
        }
      }

      const g = t.mesh.group;
      g.position.set(t.x, 0, t.z);
      g.rotation.y = t.h;
      t.spin += (t.speed / t.mesh.model.wheelR) * dt;
      t.mesh.wheels.forEach(w => { w.rotation.x = t.spin; });
      const steerTarget = t.isTurning ? clamp(wrapAngle(t.targetHeading - t.h) * 0.9, -0.45, 0.45) : 0;
      t.steerSmooth += clamp(steerTarget - t.steerSmooth, -3 * dt, 3 * dt);
      t.mesh.steerPivots.forEach(p => { p.rotation.y = t.steerSmooth; });
      t.mesh.tailMat.color.setHex(t.braking ? 0xff2a2a : 0x8a1212);
      t.mesh.indMat.color.setHex(t.signal !== 0 && blink ? 0xffb020 : 0x6b4a12);
    }
  }

  for (let k = 0; k < TRAFFIC_N; k++) spawnTraffic(true);

  function reshuffleTraffic() {
    for (const t of traffic) { scene.remove(t.mesh.group); disposeCar(t.mesh); }
    traffic.length = 0;
    for (let k = 0; k < TRAFFIC_N; k++) spawnTraffic(true);
  }

  const fire = (function () {
    const FN = 110;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(FN * 3);
    const col = new Float32Array(FN * 3);
    const vel = new Float32Array(FN * 3);
    const life = new Float32Array(FN);
    const maxLife = new Float32Array(FN);
    for (let i = 0; i < FN; i++) pos[i * 3 + 1] = -50;
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const g2 = cv.getContext('2d');
    const grd = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.35, 'rgba(255,255,255,.6)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');

    const tex = new THREE.CanvasTexture(cv);

      size: 1.9, map: tex, transparent: true, opacity: 0.95,

    const light = new THREE.PointLight(0xff6a22, 0, 24, 2);
    scene.add(light);
    let on = false;
    const cHot = new THREE.Color(0xffd23e), cCold = new THREE.Color(0xff3a00), tmpC = new THREE.Color();

    function enginePos() {
      const M = player.model;
      return [car.x + Math.sin(car.h) * M.len * 0.3, car.y + 0.95, car.z + Math.cos(car.h) * M.len * 0.3];
    }
    function respawn(i, ex, ey, ez) {
      const k = i * 3;
      pos[k] = ex + (Math.random() - 0.5) * 1.2;
      pos[k + 1] = ey + Math.random() * 0.5;
      pos[k + 2] = ez + (Math.random() - 0.5) * 1.2;
      vel[k] = (Math.random() - 0.5) * 2.4;
      vel[k + 1] = 1.8 + Math.random() * 2.6;
      vel[k + 2] = (Math.random() - 0.5) * 2.4;

        life[i] -= dt;
        const k = i * 3;
        if (life[i] <= 0) { respawn(i, ex, ey, ez); continue; }
        pos[k] += vel[k] * dt; pos[k + 1] += vel[k + 1] * dt; pos[k + 2] += vel[k + 2] * dt;
        vel[k + 1] += 2.4 * dt;
        vel[k] *= (1 - 1.2 * dt); vel[k + 2] *= (1 - 1.2 * dt);
        tmpC.copy(cCold).lerp(cHot, life[i] / maxLife[i]);

      geo.attributes.color.needsUpdate = true;

      player.bodyMat.emissive.setHex(0xff4400);

    }
    return {
      start() {

      stop() { on = false; pts.visible = false; light.intensity = 0; if (player) player.bodyMat.emissiveIntensity = 0; },
      update

  })();

  function groundHeight(x, z) {
    const u = (x + HALF - R) / P, v = (z + HALF - R) / P;
    if (u < 0 || v < 0) return 0;
    const iu = Math.floor(u), iv = Math.floor(v);
    if (iu >= N || iv >= N) return 0;
    return ((u - iu) * P <= B && (v - iv) * P <= B) ? SW : 0;
  }

  let crashes = 0, lastCrashT = 0;
  function registerCrash(j) {
    if (j < 5.5 || wrecked) return;
    const now = performance.now();
    if (now - lastCrashT < 800) return;
    lastCrashT = now;
    crashes = Math.min(3, crashes + 1);
    updateDamage();
    if (crashes >= 3) wreck();
  }

  function collide() {
    for (let pass = 0; pass < 2; pass++) {
      const fx = Math.sin(car.h), fz = Math.cos(car.h);
      for (const o of [CAR_OFF, 0, -CAR_OFF]) {
        let cx = car.x + fx * o, cz = car.z + fz * o;
        for (let bi = 0; bi < colliders.length; bi++) {
          const b = colliders[bi];
          if (b.off) continue;
          if (cx < b.minX - CAR_R || cx > b.maxX + CAR_R || cz < b.minZ - CAR_R || cz > b.maxZ + CAR_R) continue;
          const qx = clamp(cx, b.minX, b.maxX), qz = clamp(cz, b.minZ, b.maxZ);
          const dx = cx - qx, dz = cz - qz, d2 = dx * dx + dz * dz;
          if (d2 >= CAR_R * CAR_R) continue;
          if (b.sign) {   // signs are light: at speed they get knocked over instead of stopping the car
            const sp = Math.hypot(car.vx, car.vz);
            if (sp > 2.0) { knockSign(b, car.vx, car.vz, sp); car.vx *= 0.95; car.vz *= 0.95; shake = Math.max(shake, 0.2); continue; }
          }
          let nx, nz, pen;
          if (d2 > 1e-8) { const d = Math.sqrt(d2); nx = dx / d; nz = dz / d; pen = CAR_R - d; }
          else {
            const l = cx - b.minX, r = b.maxX - cx, t = cz - b.minZ, bt = b.maxZ - cz;
            const m = Math.min(l, r, t, bt);
            nx = 0; nz = 0;
            if (m === l) nx = -1; else if (m === r) nx = 1; else if (m === t) nz = -1; else nz = 1;
            pen = m + CAR_R;
          }
          car.x += nx * pen; car.z += nz * pen; cx += nx * pen; cz += nz * pen;
          const vn = car.vx * nx + car.vz * nz;
          if (vn < 0) {
            const j = -(1.3 - STAB * 0.02) * vn;
            car.vx += nx * j; car.vz += nz * j;
            const tx = -nz, tz = nx, vt = car.vx * tx + car.vz * tz;
            car.vx -= tx * vt * 0.05; car.vz -= tz * vt * 0.05;
            const rx = cx - car.x, rz = cz - car.z;
            const torque = (rz * nx - rx * nz) * j;
            car.h += clamp(torque * 0.012 * (1.5 - STAB * 0.1), -0.12, 0.12);
            shake = Math.max(shake, Math.min(1, j / 16));
            sfx.impact(j);
            registerCrash(j);
          }
        }
      }
    }
  }

  /* ---------------------------------------------------------------
     Rigid bodies (parked cars) and falling signs
  --------------------------------------------------------------- */
  const STATIC_B = { x: 0, z: 0, vx: 0, vz: 0, w: 0, invM: 0, invI: 0 };
  const MU_SLIDE = 0.6 * 9.8;   // locked wheels sliding on asphalt
  const ROT_FRIC = 3.0;         // rad/s^2 of spin removed by tyre scrub

  // Impulse between two bodies at a contact point; n points from A to B. Returns the normal impulse.
  function applyImpulse(A, B, nx, nz, cpx, cpz, e, mu) {
    const rAx = cpx - A.x, rAz = cpz - A.z, rBx = cpx - B.x, rBz = cpz - B.z;
    const vAx = A.vx + A.w * rAz, vAz = A.vz - A.w * rAx;
    const vBx = B.vx + B.w * rBz, vBz = B.vz - B.w * rBx;
    const vn = (vBx - vAx) * nx + (vBz - vAz) * nz;
    if (vn >= 0) return 0;
    const rAn = rAz * nx - rAx * nz, rBn = rBz * nx - rBx * nz;
    const denom = A.invM + B.invM + rAn * rAn * A.invI + rBn * rBn * B.invI;
    const j = -(1 + e) * vn / denom;
    const Jx = j * nx, Jz = j * nz;
    A.vx -= Jx * A.invM; A.vz -= Jz * A.invM; A.w -= (rAz * Jx - rAx * Jz) * A.invI;
    B.vx += Jx * B.invM; B.vz += Jz * B.invM; B.w += (rBz * Jx - rBx * Jz) * B.invI;

    // friction along the contact surface (paint scraping, glancing blows)
    const tx = -nz, tz = nx;
    const wAx = A.vx + A.w * rAz, wAz = A.vz - A.w * rAx;
    const wBx = B.vx + B.w * rBz, wBz = B.vz - B.w * rBx;
    const vt = (wBx - wAx) * tx + (wBz - wAz) * tz;
    const rAt = rAz * tx - rAx * tz, rBt = rBz * tx - rBx * tz;
    const dT = A.invM + B.invM + rAt * rAt * A.invI + rBt * rBt * B.invI;
    const lim = mu * j;
    const jt = clamp(-vt / dT, -lim, lim);
    const Tx = jt * tx, Tz = jt * tz;
    A.vx -= Tx * A.invM; A.vz -= Tz * A.invM; A.w -= (rAz * Tx - rAx * Tz) * A.invI;
    B.vx += Tx * B.invM; B.vz += Tz * B.invM; B.w += (rBz * Tx - rBx * Tz) * B.invI;
    return j;
  }

  function placeBody(b, instant) {
    const gh = groundHeight(b.x, b.z);
    b.y = instant ? gh : b.y + (gh - b.y) * 0.35;
    b.group.position.set(b.x, b.y, b.z);
    b.group.rotation.y = b.h;
  }

  function integrateBody(b, dt) {
    if (b.sleep) return;
    const sp = Math.hypot(b.vx, b.vz);
    if (sp > 0) { const k = Math.max(0, sp - MU_SLIDE * dt) / sp; b.vx *= k; b.vz *= k; }
    if (b.w !== 0) b.w = Math.sign(b.w) * Math.max(0, Math.abs(b.w) - ROT_FRIC * dt);
    b.x += b.vx * dt; b.z += b.vz * dt; b.h += b.w * dt;
    if (Math.hypot(b.vx, b.vz) < 0.05 && Math.abs(b.w) < 0.05) {
      b.vx = b.vz = b.w = 0; b.sleep = true; placeBody(b, true);
    }
  }

  function bodyVsStatic(b) {
    const fx = Math.sin(b.h), fz = Math.cos(b.h);
    for (const o of b.offs) {
      let cx = b.x + fx * o, cz = b.z + fz * o;
      for (let i = 0; i < colliders.length; i++) {
        const c = colliders[i];
        if (c.off) continue;
        if (cx < c.minX - b.r || cx > c.maxX + b.r || cz < c.minZ - b.r || cz > c.maxZ + b.r) continue;
        const qx = clamp(cx, c.minX, c.maxX), qz = clamp(cz, c.minZ, c.maxZ);
        const dx = cx - qx, dz = cz - qz, d2 = dx * dx + dz * dz;
        if (d2 >= b.r * b.r) continue;
        if (c.sign) {
          const sp = Math.hypot(b.vx, b.vz);
          if (sp > 2) { knockSign(c, b.vx, b.vz, sp); b.vx *= 0.94; b.vz *= 0.94; continue; }
        }
        let nx, nz, pen;
        if (d2 > 1e-8) { const d = Math.sqrt(d2); nx = dx / d; nz = dz / d; pen = b.r - d; }
        else {
          const l = cx - c.minX, r = c.maxX - cx, t = cz - c.minZ, bt = c.maxZ - cz, m = Math.min(l, r, t, bt);
          nx = 0; nz = 0;
          if (m === l) nx = -1; else if (m === r) nx = 1; else if (m === t) nz = -1; else nz = 1;
          pen = m + b.r;
        }
        b.x += nx * pen; b.z += nz * pen; cx += nx * pen; cz += nz * pen;
        STATIC_B.x = qx; STATIC_B.z = qz;
        applyImpulse(b, STATIC_B, -nx, -nz, qx, qz, 0.2, 0.3);
      }
    }
  }

  function playerVsBodies() {
    const pfx = Math.sin(car.h), pfz = Math.cos(car.h);
    const preach = CAR_OFF + CAR_R + 1;
    for (const b of bodies) {
      const ddx = b.x - car.x, ddz = b.z - car.z, lim = preach + b.reach;
      if (ddx * ddx + ddz * ddz > lim * lim) continue;
      const bfx = Math.sin(b.h), bfz = Math.cos(b.h);
      PB.x = car.x; PB.z = car.z; PB.vx = car.vx; PB.vz = car.vz; PB.w = 0;
      let hit = 0, touched = false;
      for (const po of [CAR_OFF, 0, -CAR_OFF]) for (const bo of b.offs) {
        const ax = PB.x + pfx * po, az = PB.z + pfz * po, bx = b.x + bfx * bo, bz = b.z + bfz * bo;
        let nx = bx - ax, nz = bz - az;
        const rs = CAR_R + b.r, d2 = nx * nx + nz * nz;
        if (d2 >= rs * rs) continue;
        const d = Math.sqrt(d2) || 1e-4; nx /= d; nz /= d;
        const pen = rs - d, tot = PB.invM + b.invM;
        PB.x -= nx * pen * (PB.invM / tot); PB.z -= nz * pen * (PB.invM / tot);
        b.x += nx * pen * (b.invM / tot); b.z += nz * pen * (b.invM / tot);
        touched = true;
        const j = applyImpulse(PB, b, nx, nz, ax + nx * (CAR_R - pen * 0.5), az + nz * (CAR_R - pen * 0.5), 0.25, 0.3);
        if (j > hit) hit = j;
      }
      if (touched) {
        car.x = PB.x; car.z = PB.z; car.vx = PB.vx; car.vz = PB.vz;
        car.wKick = clamp(car.wKick + PB.w, -3, 3);
        b.sleep = false;
        if (hit > 0) {
          const dv = hit * PB.invM;
          shake = Math.max(shake, Math.min(1, dv / 14));
          sfx.impact(dv * 1.3);
          registerCrash(dv);
        }
      }
    }
  }

  function bodiesVsBodies() {
    for (let i = 0; i < bodies.length; i++) {
      const A = bodies[i];
      for (let k = i + 1; k < bodies.length; k++) {
        const B2 = bodies[k];
        if (A.sleep && B2.sleep) continue;
        const ddx = B2.x - A.x, ddz = B2.z - A.z, lim = A.reach + B2.reach;
        if (ddx * ddx + ddz * ddz > lim * lim) continue;
        const afx = Math.sin(A.h), afz = Math.cos(A.h), bfx = Math.sin(B2.h), bfz = Math.cos(B2.h);
        for (const ao of A.offs) for (const bo of B2.offs) {
          const ax = A.x + afx * ao, az = A.z + afz * ao, bx = B2.x + bfx * bo, bz = B2.z + bfz * bo;
          let nx = bx - ax, nz = bz - az;
          const rs = A.r + B2.r, d2 = nx * nx + nz * nz;
          if (d2 >= rs * rs) continue;
          const d = Math.sqrt(d2) || 1e-4; nx /= d; nz /= d;
          const pen = rs - d, tot = A.invM + B2.invM;
          A.x -= nx * pen * (A.invM / tot); A.z -= nz * pen * (A.invM / tot);
          B2.x += nx * pen * (B2.invM / tot); B2.z += nz * pen * (B2.invM / tot);
          A.sleep = false; B2.sleep = false;
          applyImpulse(A, B2, nx, nz, ax + nx * (A.r - pen * 0.5), az + nz * (A.r - pen * 0.5), 0.25, 0.3);
        }
      }
    }
  }

  /* ---------- signs falling over ---------- */
  const signAxis = new THREE.Vector3();
  function knockSign(col, vx, vz, sp) {
    const sg = col.sign;
    if (sg.state !== 'up') return;
    col.off = true; sg.state = 'falling';
    const l = Math.hypot(vx, vz) || 1;
    sg.dx = vx / l; sg.dz = vz / l;
    sg.theta = 0.03; sg.omega = clamp(sp * 0.28, 0.7, 4.2);
    fallingSigns.push(sg);
    sfx.clank(sp);
  }
  function updateSigns(dt) {
    for (let i = fallingSigns.length - 1; i >= 0; i--) {
      const sg = fallingSigns[i];
      // a stiff rod pivoting about its foot: gravity speeds the fall as it tips over
      sg.omega += 4.9 * Math.sin(sg.theta) * dt;
      sg.theta += sg.omega * dt;
      if (sg.theta >= Math.PI / 2) {
        sg.theta = Math.PI / 2;
        if (sg.omega > 0.9) { sfx.clank(clamp(sg.omega * 3, 3, 10)); sg.omega = -sg.omega * 0.3; }
        else { sg.omega = 0; sg.state = 'down'; fallingSigns.splice(i, 1); }
      }
      signAxis.set(sg.dz, 0, -sg.dx);
      sg.quat.setFromAxisAngle(signAxis, sg.theta);
      sg.y = SW + 0.05 * Math.sin(sg.theta);
      // the plate twists on the way down so it ends up lying flat, face up
      const target = Math.atan2(-sg.dx, -sg.dz);
      const diff = ((target - sg.face + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
      const prog = sg.theta / (Math.PI / 2);
      sg.yaw = sg.face + diff * prog * prog;
      writeSign(sg);
    }
  }
  function resetSigns() {
    fallingSigns.length = 0;
    for (const sg of signs) {
      sg.state = 'up'; sg.theta = 0; sg.omega = 0; sg.y = SW; sg.yaw = sg.face; sg.quat.identity(); sg.col.off = false;
      writeSign(sg);
    }
  }

  function stepWorld(dt) {
    for (const b of bodies) integrateBody(b, dt);
    for (let it = 0; it < 2; it++) {
      playerVsBodies();
      bodiesVsBodies();
      for (const b of bodies) if (!b.sleep) bodyVsStatic(b);
    }
    collide();   // in case a shoved car pinned the player against a wall
    for (const b of bodies) if (!b.sleep) placeBody(b, false);
    updateSigns(dt);
  }

  function step(dt) {
    let fx = Math.sin(car.h), fz = Math.cos(car.h);
    let rx = -Math.cos(car.h), rz = Math.sin(car.h);
    const vf0 = car.vx * fx + car.vz * fz;
    const up = held('up'), down = held('down'), hb = held('hb');
    const steerIn = (held('left') ? 1 : 0) - (held('right') ? 1 : 0);

    const s = Math.min(1, Math.abs(vf0) / 26);
    const maxSteer = (STEER_LOW - (STEER_LOW - STEER_HIGH) * s) * (hb ? 1.2 : 1);
    const target = steerIn * maxSteer;
    const rate = steerIn === 0 ? 5 : STEER_RATE;
    car.steer += clamp(target - car.steer, -rate * dt, rate * dt);
    if (Math.abs(car.steer) > maxSteer) car.steer = Math.sign(car.steer) * maxSteer;

    let a = 0, braking = false, reversing = false;
    if (up && !down) {
      if (vf0 < -0.6) { a = BRAKE; braking = true; }
      else a = ENGINE * Math.max(-1, 1 - Math.pow(vf0 / VMAX, 2));
    } else if (down && !up) {
      if (vf0 > 0.6) { a = -BRAKE; braking = true; }
      else { a = -ENGINE * 0.6 * Math.max(-1, 1 - Math.pow(-vf0 / VREV, 2)); reversing = true; }
    } else {
      const c = 2.6 + 0.012 * vf0 * vf0;
      a = -Math.sign(vf0) * Math.min(Math.abs(vf0) / dt, c);
    }
    if (car.y > 0.1) a -= vf0 * 0.9;
    if (hb) a -= Math.sign(vf0) * Math.min(Math.abs(vf0) / dt, 9.5);
    let vf1 = vf0 + a * dt;
    if (braking && Math.sign(vf1) !== Math.sign(vf0)) vf1 = 0;
    car.vx += fx * (vf1 - vf0); car.vz += fz * (vf1 - vf0);
    car.accelLong += ((vf1 - vf0) / dt - car.accelLong) * Math.min(1, dt * 10);
    car.braking = braking; car.reversing = reversing;

    if (settings.shake && (Math.abs(car.vf) > 25 || car.hb)) {
      shake = Math.max(shake, 0.15);
    }

    let yaw = (vf1 / WHEELBASE) * Math.tan(car.steer);
    const maxLat = hb ? MAXLAT * 1.9 : MAXLAT;
    if (Math.abs(vf1) > 1 && Math.abs(vf1 * yaw) > maxLat) yaw = Math.sign(yaw) * maxLat / Math.abs(vf1);
    car.yawRate = yaw;
    car.h += yaw * dt;
    car.h += car.wKick * dt; car.wKick *= Math.exp(-7 * dt);

    fx = Math.sin(car.h); fz = Math.cos(car.h); rx = -Math.cos(car.h); rz = Math.sin(car.h);
    let vf2 = car.vx * fx + car.vz * fz;
    let vl2 = car.vx * rx + car.vz * rz;
    let grip = GRIP;
    if (hb) grip = 0.9;
    else if (braking && Math.abs(vf2) > 8 && Math.abs(car.steer) > 0.05) grip = 3.0;
    vl2 *= Math.exp(-grip * dt);
    car.vx = fx * vf2 + rx * vl2; car.vz = fz * vf2 + rz * vl2;
    car.vf = vf2; car.vl = vl2;
    car.hb = hb;

    car.x += car.vx * dt; car.z += car.vz * dt;
    collide();
    stepWorld(dt);

    car.y += (groundHeight(car.x, car.z) - car.y) * Math.min(1, dt * 14);

    const pT = clamp(-car.accelLong * 0.0035, -0.075, 0.075);
    const latAcc = vf2 * yaw - vl2 * 0.0;
    const rT = clamp(latAcc * 0.0030 * (1.4 - STAB * 0.09), -0.11, 0.11);
    car.pitchV += ((pT - car.pitch) * 70 - car.pitchV * 9) * dt; car.pitch += car.pitchV * dt;
    car.rollV += ((rT - car.roll) * 70 - car.rollV * 9) * dt; car.roll += car.rollV * dt;
    car.spin += (vf2 / 0.39) * dt;
  }

  let paused = false, dirty = true, view = 'menu';
  const $ = id => document.getElementById(id);
  const pauseEl = $('pause'), btnPause = $('tglPause');
  const views = { menu: $('menuView'), garage: $('garageView'), settings: $('settingsView') };

  let wrecked = false;
  const wreckEl = $('wreck');
  const dmgEls = document.querySelectorAll('#dmg i');
  function updateDamage() { dmgEls.forEach((el, i) => el.classList.toggle('hit', i < crashes)); }
  function wreck() {
    if (wrecked) return;
    wrecked = true;
    fire.start();
    document.body.classList.add('is-wrecked');
    wreckEl.classList.add('open');
    sfx.setPaused(true);
    for (const k in keysKB) keysKB[k] = false;
    for (const k in keysPtr) keysPtr[k] = false;
  }
  function recover() {
    wreckEl.classList.remove('open');
    document.body.classList.remove('is-wrecked');
    wrecked = false;
    crashes = 0; lastCrashT = 0;
    updateDamage();
    fire.stop();
    resetGame();
    setPaused(false);
    sfx.setPaused(false);
  }
  updateDamage();

  const STAT_DEFS = [['speed', 'Top speed'], ['accel', 'Acceleration'], ['handling', 'Handling'],
                     ['brake', 'Braking'], ['grip', 'Grip'], ['stability', 'Stability']];
  const COLORS = [['Red', 0xe8322b], ['Orange', 0xf28c28], ['Yellow', 0xf2c230], ['Green', 0x2e9d5b], ['Teal', 0x1fa5a5],
                  ['Blue', 0x2f6fe0], ['Purple', 0x7a4cc7], ['Pink', 0xe85d9c], ['White', 0xf1f1ec], ['Black', 0x2d3138]];
  const fills = {}, vals = {}, swatchEls = [];
  STAT_DEFS.forEach(([k, label]) => {
    const row = document.createElement('div'); row.className = 'stat';
    row.innerHTML = '<span>' + label + '</span><span class="bar"><i></i></span><b></b>';
    $('stats').appendChild(row); fills[k] = row.querySelector('i'); vals[k] = row.querySelector('b');
  });
  COLORS.forEach(([name, hex]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.title = name;
    b.style.background = '#' + hex.toString(16).padStart(6, '0');
    b.setAttribute('role', 'radio'); b.setAttribute('aria-label', name);
    b.addEventListener('click', () => pickColor(hex));
    $('swatches').appendChild(b); swatchEls.push({ el: b, hex });
  });

  function renderGarage() {
    const m = CAR_MODELS[playerKey];
    $('carName').textContent = m.name;
    $('carDesc').textContent = m.desc;
    $('carDots').innerHTML = MODEL_KEYS.map(k => '<i class="' + (k === playerKey ? 'on' : '') + '"></i>').join('');
    STAT_DEFS.forEach(([k]) => { fills[k].style.width = (m.stats[k] * 10) + '%'; vals[k].textContent = m.stats[k]; });
    swatchEls.forEach(({ el, hex }) => {
      const sel = hex === carColors[playerKey];
      el.classList.toggle('sel', sel); el.setAttribute('aria-checked', String(sel));
    });
  }
  function pickColor(hex) {
    carColors[playerKey] = hex;
    player.setColor(hex);
    if (pv && pv.car) pv.car.setColor(hex);
    dirty = true; renderGarage();
  }
  function cycleCar(d) {
    const i = (MODEL_KEYS.indexOf(playerKey) + d + MODEL_KEYS.length) % MODEL_KEYS.length;
    setPlayerCar(MODEL_KEYS[i]);
    refreshPreviewCar(); renderGarage(); dirty = true;
  }

  let pv = null;
  function initPreview() {
    if (pv) return;
    const r = new THREE.WebGLRenderer({ canvas: $('preview'), antialias: true, alpha: true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.95));
    const dl = new THREE.DirectionalLight(0xffffff, 0.85); dl.position.set(-4, 8, 5); sc.add(dl);
    const plat = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.7, 0.16, 48), new THREE.MeshLambertMaterial({ color: 0x2a3a4d }));
    plat.position.y = -0.09; sc.add(plat);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.04, 8, 64).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffb000 }));
    ring.position.y = 0; sc.add(ring);
    const cam = new THREE.PerspectiveCamera(30, 2, 0.1, 60);
    cam.position.set(0, 3.5, 9.6); cam.lookAt(0, 0.7, 0);
    const pivot = new THREE.Group(); sc.add(pivot);
    pv = { r, sc, cam, pivot, car: null };
  }
  function sizePreview() {
    const c = $('preview'), w = c.clientWidth, h = c.clientHeight;
    if (!pv || !w || !h) return;
    pv.r.setSize(w, h, false); pv.cam.aspect = w / h; pv.cam.updateProjectionMatrix();
  }
  function refreshPreviewCar() {
    if (!pv) return;
    if (pv.car) { pv.pivot.remove(pv.car.group); disposeCar(pv.car); }
    pv.car = makeCar({ color: carColors[playerKey], detailed: true, model: playerKey, ghost: false });
    pv.pivot.add(pv.car.group);
  }
  function previewTick(dt) {
    pv.pivot.rotation.y += dt * 0.7;
    pv.r.render(pv.sc, pv.cam);
  }

  function showView(v) {
    view = v;
    for (const k in views) views[k].classList.toggle('show', k === v);
    if (v === 'garage') { initPreview(); sizePreview(); refreshPreviewCar(); renderGarage(); }
    const f = $(v === 'garage' ? 'btnBack' : v === 'settings' ? 'btnSetBack' : 'btnContinue');
    if (f) f.focus({ preventScroll: true });
  }

  function setPaused(on) {
    if (on === paused) return;
    paused = on; dirty = true;
    document.body.classList.toggle('is-paused', on);
    pauseEl.classList.toggle('open', on);
    btnPause.classList.toggle('on', on);
    btnPause.setAttribute('aria-pressed', String(on));
    for (const k in keysKB) keysKB[k] = false;
    for (const k in keysPtr) keysPtr[k] = false;
    sfx.setPaused(on);
    if (on) showView('menu');
  }

  function resetGame() {
    const sp = randomRoadPoint();
    Object.assign(car, { x: sp.x, z: sp.z, h: sp.h, vx: 0, vz: 0, steer: 0, y: 0, spin: 0,
      pitch: 0, pitchV: 0, roll: 0, rollV: 0, accelLong: 0, vf: 0, vl: 0, yawRate: 0,
      braking: false, reversing: false, hb: false, wKick: 0 });
    shake = 0;
    reshuffleTraffic();
    reshuffleParked();
    resetSigns();
    const z = new THREE.Object3D(); z.scale.setScalar(0); z.updateMatrix();
    for (let i = 0; i < MAX_MARKS; i++) marks.setMatrixAt(i, z.matrix);
    marks.instanceMatrix.needsUpdate = true;
    markIdx = 0; lastMarkX = 1e9; lastMarkZ = 1e9;
    wheelTrail = [null, null];
    camTarget.set(car.x, 0, car.z);
    player.group.position.set(car.x, 0, car.z);
    player.group.rotation.y = car.h;
    player.chassis.rotation.set(0, 0, 0);
  }

  btnPause.addEventListener('click', () => { setPaused(!paused); btnPause.blur(); });
  $('btnContinue').addEventListener('click', () => setPaused(false));
  $('btnSettings').addEventListener('click', () => showView('settings'));
  $('btnSetBack').addEventListener('click', () => showView('menu'));
  $('btnGarage').addEventListener('click', () => showView('garage'));
  $('btnBack').addEventListener('click', () => showView('menu'));
  $('btnRefresh').addEventListener('click', () => { resetGame(); setPaused(false); });
  $('btnRestart').addEventListener('click', () => { recover(); $('btnRestart').blur(); });
  $('carPrev').addEventListener('click', () => cycleCar(-1));
  $('carNext').addEventListener('click', () => cycleCar(1));

  const volMusic = $('volMusic'), volSfx = $('volSfx');
  volMusic.value = settings.music; volSfx.value = settings.sfx;
  $('volMusicV').textContent = settings.music; $('volSfxV').textContent = settings.sfx;
  volMusic.addEventListener('input', () => {
    settings.music = +volMusic.value; $('volMusicV').textContent = volMusic.value;
    sfx.setVolume(settings.music / 100, settings.sfx / 100); saveSettings();
  });
  volSfx.addEventListener('input', () => {
    settings.sfx = +volSfx.value; $('volSfxV').textContent = volSfx.value;
    sfx.setVolume(settings.music / 100, settings.sfx / 100); saveSettings();
  });
  function bindPill(id, key, apply) {
    const el = $(id);
    const sync = () => { el.classList.toggle('on', settings[key]); el.setAttribute('aria-checked', String(settings[key])); };
    el.addEventListener('click', () => { settings[key] = !settings[key]; sync(); apply(); saveSettings(); el.blur(); });
    sync();
  }
  bindPill('pillShadows', 'shadows', () => { sun.castShadow = settings.shadows; });
  bindPill('pillMarks', 'marks', () => { marks.visible = settings.marks; });
  bindPill('pillShake', 'shake', () => {});

  window.addEventListener('keydown', e => {
    if (wrecked && (e.code === 'KeyR' || e.code === 'Enter') && !e.repeat) {
      e.preventDefault(); recover();
    } else if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat && !wrecked) {
      e.preventDefault();
      if (paused && (view === 'garage' || view === 'settings') && e.code === 'Escape') showView('menu');
      else setPaused(!paused);
    } else if (paused && view === 'garage') {
      if (e.code === 'ArrowLeft') { e.preventDefault(); cycleCar(-1); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); cycleCar(1); }
    }
  });
  window.addEventListener('resize', () => { dirty = true; if (pv && view === 'garage') sizePreview(); });

  const camTarget = new THREE.Vector3(car.x, 0, car.z);
  const spdEl = document.getElementById('spd');
  let hudTimer = 0;

  function updateVisuals(dt) {
    const g = player.group;
    g.position.set(car.x, car.y, car.z);
    g.rotation.y = car.h;
    player.chassis.rotation.x = car.pitch;
    player.chassis.rotation.z = car.roll;
    player.wheels.forEach(w => { w.rotation.x = car.spin; });
    player.steerPivots.forEach(p => { p.rotation.y = car.steer; });
    player.tailMat.color.setHex((car.braking || (held('down') && car.vf > 0.6)) ? 0xff2a2a : (car.reversing ? 0xf2f2f2 : 0x8a1212));

    const slipping = car.hb && Math.abs(car.vf) > 3;
    if (slipping && car.y < 0.1) {
      const dx = car.x - lastMarkX, dz = car.z - lastMarkZ;
      if (dx * dx + dz * dz > 0.04) {
        const fx = Math.sin(car.h), fz = Math.cos(car.h), rx = -Math.cos(car.h), rz = Math.sin(car.h);
        const cm = CAR_MODELS[playerKey], wx = cm.wheelX;
        [-wx, wx].forEach((side, k) => {
          const nx = car.x - fx * cm.wheelZ + rx * side;
          const nz = car.z - fz * cm.wheelZ + rz * side;
          const p = wheelTrail[k];
          if (p && Math.hypot(nx - p.x, nz - p.z) < 3) dropMark(p.x, p.z, nx, nz);
          wheelTrail[k] = { x: nx, z: nz };
        });
        lastMarkX = car.x; lastMarkZ = car.z;
      }
    } else {
      wheelTrail[0] = wheelTrail[1] = null;
    }

    const speed = Math.hypot(car.vx, car.vz);
    const sf = clamp(speed / VMAX, 0, 1);
    const lead = 0.32;
    const k = 1 - Math.exp(-5 * dt);
    camTarget.x += (car.x + car.vx * lead - camTarget.x) * k;
    camTarget.z += (car.z + car.vz * lead - camTarget.z) * k;
    const camH = 44 + sf * 16, camD = camH * 0.56;
    shake *= Math.exp(-6 * dt);
    let sx = 0, sz = 0;
    if (settings.shake) { sx = (Math.random() - 0.5) * shake * 1.4; sz = (Math.random() - 0.5) * shake * 1.4; }
    camera.position.set(camTarget.x + sx, camH, camTarget.z + camD + sz);
    camera.lookAt(camTarget.x, 0, camTarget.z);

    sun.position.set(car.x + SUN_OFFSET.x, SUN_OFFSET.y, car.z + SUN_OFFSET.z);
    sun.target.position.set(car.x, 0, car.z);
    const texel = (sc.right - sc.left) / sun.shadow.mapSize.x;
    _lightView.lookAt(sun.position, sun.target.position, _upVec);
    const e = _lightView.elements;
    _snapP.copy(sun.target.position).sub(sun.position);
    const lx = e[0] * _snapP.x + e[1] * _snapP.y + e[2] * _snapP.z;
    const ly = e[4] * _snapP.x + e[5] * _snapP.y + e[6] * _snapP.z;
    const lz = e[8] * _snapP.x + e[9] * _snapP.y + e[10] * _snapP.z;
    const slx = Math.round(lx / texel) * texel;
    const sly = Math.round(ly / texel) * texel;
    _snapP.set(e[0] * slx + e[4] * sly + e[8] * lz,
               e[1] * slx + e[5] * sly + e[9] * lz,
               e[2] * slx + e[6] * sly + e[10] * lz).add(sun.position);
    sun.target.position.copy(_snapP);
    sun.position.copy(_snapP).add(SUN_OFFSET);
    sun.target.updateMatrixWorld();

    let slipAmt = car.y < 0.1 ? clamp((Math.abs(car.vl) - 2) / 5, 0, 1) : 0;
    if (car.braking && Math.abs(car.vf) > 9 && car.y < 0.1) slipAmt = Math.max(slipAmt, 0.6);
    if (car.hb && Math.abs(car.vf) > 4 && car.y < 0.1) slipAmt = Math.max(slipAmt, 0.85);
    sfx.update(speed, (held('up') || held('down')) ? 1 : 0, slipAmt, car.hb);

    hudTimer += dt;
    if (hudTimer > 0.06) { hudTimer = 0; spdEl.textContent = Math.round(speed * 3.6); }
    for (const kk in keyEls) keyEls[kk].classList.toggle('pressed', held(kk));

    updateFov(sf);
  }

  function updateFov(sf) {
    const aspect = window.innerWidth / window.innerHeight;
    let vfov = 46 + sf * 6;
    const minHalfH = Math.tan(THREE.MathUtils.degToRad(46 / 2)) * 1.15;
    if (aspect < 1.15) {
      const half = Math.atan(minHalfH / aspect);
      vfov = THREE.MathUtils.radToDeg(half * 2) + sf * 6;
    }
    if (Math.abs(camera.fov - vfov) > 0.01) { camera.fov = vfov; camera.updateProjectionMatrix(); }
  }

  function onResize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();

  let last = performance.now();
  camTarget.set(car.x, 0, car.z);
  renderer.render(scene, camera);
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;
    if (paused) {
      if (dirty) { renderer.render(scene, camera); dirty = false; }
      if (view === 'garage' && pv) previewTick(dt);
      return;
    }
    if (wrecked) {
      fire.update(dt);
      renderer.render(scene, camera);
      return;
    }
    const n = Math.ceil(dt / (1 / 90));
    for (let i = 0; i < n; i++) step(dt / n);
    updateTrafficLights(dt);
    updateTraffic(dt);
    updateVisuals(dt);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
